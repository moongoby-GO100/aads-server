# Idempotent bootstrap endpoints may retry on the blue/green standby.
# Streaming and non-idempotent API requests remain governed by the general
# /api/v1/ location, where proxy_next_upstream is intentionally disabled.
location = /api/v1/health {
    proxy_pass http://aads_api/api/v1/health;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 10s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_timeout 8s;
    proxy_next_upstream_tries 2;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
}

location = /api/v1/auth/me {
    proxy_pass http://aads_api/api/v1/auth/me;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_connect_timeout 3s;
    proxy_read_timeout 15s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_timeout 8s;
    proxy_next_upstream_tries 2;
    add_header Cache-Control "no-store, no-cache, must-revalidate";
}
