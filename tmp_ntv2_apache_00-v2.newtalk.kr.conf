    SSLCertificateFile      /etc/ssl_newtalk_le/ssl.crt
    SSLCertificateKeyFile   /etc/ssl_newtalk_le/ssl.key
    SSLCertificateChainFile /etc/ssl_newtalk_le/chain_ssl.crt
    SSLCACertificateFile    /etc/ssl_newtalk_le/chain_ssl.crt
    Header always set Strict-Transport-Security "max-age=31536000"

