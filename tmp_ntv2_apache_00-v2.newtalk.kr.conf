# =============================================================================
# v2.newtalk.kr → NTV2 (Next.js :3000 + Laravel API :8080 + Reverb WS :6001)
# 생성: NTV2-029 (2026-03-06 KST)
# =============================================================================

<VirtualHost *:80>
    ServerName v2.newtalk.kr

    ErrorLog  ${APACHE_LOG_DIR}/v2.newtalk.kr_error.log
    CustomLog ${APACHE_LOG_DIR}/v2.newtalk.kr_access.log combined

    # ── Cloudflare Real IP ──
    RemoteIPHeader CF-Connecting-IP
    RemoteIPTrustedProxy 173.245.48.0/20
    RemoteIPTrustedProxy 103.21.244.0/22
    RemoteIPTrustedProxy 103.22.200.0/22
    RemoteIPTrustedProxy 103.31.4.0/22
    RemoteIPTrustedProxy 141.101.64.0/18
    RemoteIPTrustedProxy 108.162.192.0/18
    RemoteIPTrustedProxy 190.93.240.0/20
    RemoteIPTrustedProxy 188.114.96.0/20
    RemoteIPTrustedProxy 197.234.240.0/22
    RemoteIPTrustedProxy 198.41.128.0/17
    RemoteIPTrustedProxy 162.158.0.0/15
    RemoteIPTrustedProxy 104.16.0.0/13
    RemoteIPTrustedProxy 104.24.0.0/14
    RemoteIPTrustedProxy 172.64.0.0/13
    RemoteIPTrustedProxy 131.0.72.0/22

    ProxyPreserveHost On
    RequestHeader set X-Real-IP "%{REMOTE_ADDR}s"
    RequestHeader set X-Forwarded-For "%{X-Forwarded-For}e" env=HTTP_X_FORWARDED_FOR
    RequestHeader set X-Forwarded-Proto "https"

    RewriteEngine On

    # ── Reverb WebSocket (/app/) ──
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteCond %{REQUEST_URI} ^/app/ [NC]
    RewriteRule ^/app/(.*)$ ws://127.0.0.1:6001/app/$1 [P,L]

    # ── Next.js WebSocket (HMR) ──
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*)$ ws://127.0.0.1:3000/$1 [P,L]

    # ── Reverb HTTP (/app/) ──
    <Location /app/>
        ProxyPass        http://127.0.0.1:6001/app/
        ProxyPassReverse http://127.0.0.1:6001/app/
    </Location>

    # ── Laravel API (/api/) ──
    <Location /api/>
        ProxyPass        http://127.0.0.1:8080/api/
        ProxyPassReverse http://127.0.0.1:8080/api/
    </Location>

    # ── Next.js 정적 파일 캐시 ──
    <Location /_next/static/>
        ProxyPass        http://127.0.0.1:3000/_next/static/
        ProxyPassReverse http://127.0.0.1:3000/_next/static/
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Location>

    # ── 디자인 프리뷰 (Next.js 미들웨어 우회) ──
    Alias /discover.html /srv/newtalk-v2/frontend/public/discover.html
    <Directory /srv/newtalk-v2/frontend/public>
        Require all granted
        Options -Indexes
    </Directory>
    <Location /discover.html>
        ProxyPass !
    </Location>

    # ── wholesale 프리뷰 (Next.js 미들웨어 우회) ──
    Alias /wholesale.html /srv/newtalk-v2/frontend/public/wholesale.html
    <Location /wholesale.html>
        ProxyPass !
    </Location>

    # ── wholesale-design 프리뷰 (Next.js 미들웨어 우회) ──
    Alias /wholesale-design.html /srv/newtalk-v2/frontend/public/wholesale-design.html
    <Location /wholesale-design.html>
        ProxyPass !
    </Location>

    # ── 기획서 뷰어 ──
    Alias /plan-v1.2.html /srv/newtalk-v2/frontend/public/plan-v1.2.html
    <Location /plan-v1.2.html>
        ProxyPass !
    </Location>
    Alias /NTV2-V2-PLAN-v1.2.md /srv/newtalk-v2/frontend/public/NTV2-V2-PLAN-v1.2.md
    <Location /NTV2-V2-PLAN-v1.2.md>
        ProxyPass !
    </Location>
    Alias /plan-v1.3.html /srv/newtalk-v2/frontend/public/plan-v1.3.html
    <Location /plan-v1.3.html>
        ProxyPass !
    </Location>
    Alias /NT-UI-ROLES-PLAN.html /srv/newtalk-v2/frontend/public/NT-UI-ROLES-PLAN.html
    <Location /NT-UI-ROLES-PLAN.html>
        ProxyPass !
    </Location>
    Alias /NT-PRODUCT-REGISTRATION-UI-PLAN-v1.0.html /srv/newtalk-v2/frontend/public/NT-PRODUCT-REGISTRATION-UI-PLAN-v1.0.html
    <Location /NT-PRODUCT-REGISTRATION-UI-PLAN-v1.0.html>
        ProxyPass !
    </Location>
    Alias /NT-PRODUCT-REGISTRATION-UI-PLAN-v1.1.html /srv/newtalk-v2/frontend/public/NT-PRODUCT-REGISTRATION-UI-PLAN-v1.1.html
    <Location /NT-PRODUCT-REGISTRATION-UI-PLAN-v1.1.html>
        ProxyPass !
    </Location>
    Alias /NT-PRODUCT-REGISTRATION-UI-PLAN-v1.1-20260505.html /srv/newtalk-v2/frontend/public/NT-PRODUCT-REGISTRATION-UI-PLAN-v1.1-20260505.html
    <Location /NT-PRODUCT-REGISTRATION-UI-PLAN-v1.1-20260505.html>
        ProxyPass !
    </Location>
    Alias /NT-PRODUCT-REGISTRATION-UI-PLAN-v1.2-20260505.html /srv/newtalk-v2/frontend/public/NT-PRODUCT-REGISTRATION-UI-PLAN-v1.2-20260505.html
    <Location /NT-PRODUCT-REGISTRATION-UI-PLAN-v1.2-20260505.html>
        ProxyPass !
    </Location>
    Alias /NT-PRODUCT-REGISTRATION-UI-PLAN-v1.3-20260505.html /srv/newtalk-v2/frontend/public/NT-PRODUCT-REGISTRATION-UI-PLAN-v1.3-20260505.html
    <Location /NT-PRODUCT-REGISTRATION-UI-PLAN-v1.3-20260505.html>
        ProxyPass !
    </Location>
    # ── 메인: Next.js 프론트엔드 ──
    ProxyPass        / http://127.0.0.1:3000/
    ProxyPassReverse / http://127.0.0.1:3000/
    ProxyTimeout 60
</VirtualHost>

# ── HTTPS (443) ──
