<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>ACCT 매출 상세</title><style>
:root{--bg:#f4f6f9;--panel:#fff;--line:#d8dee7;--line2:#eaeef4;--ink:#16202e;--muted:#5b6b80;--accent:#1b4fd8;--head:#eef2f7;--err:#b3261e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:13px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","Malgun Gothic",sans-serif}
header{background:#0f1b2d;color:#fff;padding:10px 14px;font-weight:700}.wrap{padding:10px 12px 40px}.panel{background:#fff;border:1px solid var(--line);border-radius:6px;margin-bottom:10px}.ph{padding:8px 10px;border-bottom:1px solid var(--line2);font-weight:700}.pb{padding:10px}.tabs{display:flex;background:#e3e9f1;padding:0 10px}.tabs button{border:0;background:transparent;padding:9px 14px;color:var(--muted)}.tabs button.on{background:#fff;color:var(--accent);font-weight:700}
.filters{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}.f label{display:block;font-size:11px;color:var(--muted);margin-bottom:3px}.f input,.f select{width:100%;padding:6px;border:1px solid var(--line);border-radius:4px}.row{display:flex;gap:6px;margin-top:9px}.b{padding:6px 12px;border:1px solid var(--line);background:#fff;border-radius:4px}.pri{background:var(--accent);color:#fff;border-color:var(--accent)}.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px}.kpi{border:1px solid var(--line);padding:10px;border-radius:6px}.kpi small{color:var(--muted)}.kpi strong{display:block;font-size:18px;margin-top:3px}.grid{overflow:auto;max-height:560px}table{border-collapse:collapse;width:100%;white-space:nowrap}th{position:sticky;top:0;background:var(--head)}th,td{padding:6px 8px;border:1px solid var(--line2)}td.num{text-align:right}.hide{display:none}#err{color:var(--err);padding:8px}.hint{color:var(--muted);font-size:11px}
</style></head><body><header>ACCT 회계원장 · 매출 상세</header>
<nav class="tabs"><button class="on" data-tab="sales">① 매출 내역</button><button data-tab="accounts">② 매출 계정과목</button><button data-tab="monthly">③ 월별 집계</button></nav>
<main class="wrap"><div id="err" class="hide"></div><section id="sales">
<div class="panel"><div class="ph">조회 조건</div><div class="pb"><div class="filters">
<div class="f"><label>사업자</label><select id="business" onchange="loadSales()"><option value="">선택</option></select></div><div class="f"><label>시작일</label><input id="from" type="date"></div><div class="f"><label>종료일</label><input id="to" type="date"></div><div class="f"><label>매출 계정과목</label><select id="account"><option value="">전체</option></select></div><div class="f"><label>내용 검색</label><input id="keyword" placeholder="전표 설명 또는 적요"></div><div class="f"><label>표시 건수</label><select id="limit"><option>100</option><option>200</option><option>500</option></select></div></div>
<div class="row"><button class="b pri" onclick="loadSales()">조회</button><button class="b" onclick="resetFilters()">조건 초기화</button><button class="b" onclick="exportCsv()">CSV 내보내기</button><span id="hint" class="hint"></span></div></div></div>
<div class="panel"><div class="pb"><div class="kpis"><div class="kpi"><small>조회 건수</small><strong id="count">0건</strong></div><div class="kpi"><small>매출 합계</small><strong id="total">0원</strong></div></div></div></div>
<div class="panel"><div class="ph">매출 내역</div><div class="grid"><table><thead><tr><th>전표일자</th><th>전표번호</th><th>상태</th><th>계정코드</th><th>계정과목</th><th>매출액</th><th>세금코드</th><th>내용</th><th>원본파일</th></tr></thead><tbody id="body"></tbody></table></div></div></section>
<section id="accounts" class="hide"><div class="panel"><div class="ph">실제 전표에서 확인된 매출 계정과목</div><div class="grid"><table><thead><tr><th>계정코드</th><th>계정과목</th><th>건수</th><th>금액</th></tr></thead><tbody id="accountBody"></tbody></table></div></div></section>
<section id="monthly" class="hide"><div class="panel"><div class="ph">월별 매출 집계</div><div class="grid"><table><thead><tr><th>회계월</th><th>건수</th><th>매출액</th></tr></thead><tbody id="monthBody"></tbody></table></div></div></section></main>
<script>
const API='/api/v1/acct-sales', token=['acct_token','aads_token','access_token','token'].map(k=>localStorage.getItem(k)).find(Boolean)||'';let rows=[];
const n=v=>Number(v||0).toLocaleString('ko-KR'), esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function business(){return document.getElementById('business').value.trim()}function params(extra={}){const p=new URLSearchParams({business_id:business(),...extra});return p}
async function api(path){const r=await fetch(API+path,{headers:{Authorization:'Bearer '+token}}),j=await r.json().catch(()=>({}));if(!r.ok)throw Error(j.detail||'HTTP '+r.status);return j}
function fail(e){const x=document.getElementById('err');x.textContent=e.message;x.classList.remove('hide')}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('on'));b.classList.add('on');['sales','accounts','monthly'].forEach(x=>document.getElementById(x).classList.toggle('hide',x!==b.dataset.tab))});
async function loadMeta(){if(!business())return;try{const [a,m]=await Promise.all([api('/accounts?'+params()),api('/monthly?'+params())]);account.innerHTML='<option value="">전체</option>'+a.items.map(x=>`<option value="${esc(x.account_code)}">${esc(x.account_code)} ${esc(x.account_name)}</option>`).join('');accountBody.innerHTML=a.items.map(x=>`<tr><td>${esc(x.account_code)}</td><td>${esc(x.account_name)}</td><td class="num">${n(x.line_count)}</td><td class="num">${n(x.amount)}</td></tr>`).join('');monthBody.innerHTML=m.items.map(x=>`<tr><td>${esc(x.month)}</td><td class="num">${n(x.line_count)}</td><td class="num">${n(x.amount)}</td></tr>`).join('')}catch(e){fail(e)}}
async function loadSales(){if(!business()){fail(Error('사업자를 선택해 주세요'));return}localStorage.setItem('acct_business_id',business());await loadMeta();const p=params({limit:limit.value});[['entry_date_from',from.value],['entry_date_to',to.value],['account_code',account.value],['keyword',keyword.value]].forEach(([k,v])=>{if(v)p.set(k,v)});try{const j=await api('/transactions?'+p);rows=j.items;body.innerHTML=rows.map(x=>`<tr><td>${esc(x.entry_date)}</td><td>${esc(x.entry_no)}</td><td>${esc(x.status)}</td><td>${esc(x.account_code)}</td><td>${esc(x.account_name)}</td><td class="num">${n(x.amount)}</td><td>${esc(x.tax_code)}</td><td>${esc(x.memo||x.description)}</td><td>${esc(x.source_file_id)}</td></tr>`).join('')||'<tr><td colspan="9">조건에 맞는 매출이 없습니다</td></tr>';count.textContent=n(j.totals.count)+'건';total.textContent=n(j.totals.amount)+'원';hint.textContent=`화면 ${j.count}건 / 조건 전체 ${n(j.totals.count)}건`}catch(e){fail(e)}}
function resetFilters(){from.value=to.value=account.value=keyword.value='';loadSales()}function exportCsv(){const cols=['entry_date','entry_no','status','account_code','account_name','amount','tax_code','memo','source_file_id'],csv=[cols.join(',')].concat(rows.map(r=>cols.map(c=>'"'+String(r[c]??'').replace(/"/g,'""')+'"').join(','))).join('\n'),a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+csv],{type:'text/csv'}));a.download='acct_sales.csv';a.click()}
async function boot(){try{const r=await fetch('/api/v1/yeoljeong-finance/tenant-registry/businesses',{headers:{Authorization:'Bearer '+token}}),j=await r.json();if(!r.ok)throw Error(j.detail||'사업자 목록 조회 실패');const selected=new URLSearchParams(location.search).get('business_id')||localStorage.getItem('acct_business_id')||'';business.innerHTML='<option value="">사업자를 선택하세요</option>'+j.businesses.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('');business.value=selected;if(business())loadSales()}catch(e){fail(e)}}boot();
</script></body></html>
