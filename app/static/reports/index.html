.section-header h2{font-size:1.2rem;font-weight:600}
.section-header .count{font-size:.8rem;color:var(--text2);margin-left:auto;
background:var(--card);padding:2px 10px;border-radius:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:14px}
.card{background:var(--card);border:1px solid var(--border);border-radius:12px;
padding:20px;text-decoration:none;color:var(--text);transition:.2s;display:flex;flex-direction:column}
.card:hover{background:var(--card-hover);border-color:var(--accent);transform:translateY(-2px);
box-shadow:0 8px 24px rgba(0,0,0,.3)}
.card .title{font-size:.95rem;font-weight:600;margin-bottom:8px;line-height:1.4}
.card .meta{display:flex;gap:8px;align-items:center;margin-top:auto;padding-top:10px;flex-wrap:wrap}

  edu:     {label:"교육자료",  icon:"📘",color:"var(--accent)",  tagClass:"tag-edu"},
  design:  {label:"기획/설계", icon:"📐",color:"var(--accent2)", tagClass:"tag-design"},
  mockup:  {label:"UI 목업",  icon:"🖥️",color:"var(--accent3)", tagClass:"tag-mockup"},
  analysis:{label:"분석/보고", icon:"📊",color:"var(--accent4)", tagClass:"tag-analysis"},
  biz:     {label:"사업",     icon:"💼",color:"var(--accent5)", tagClass:"tag-biz"},
  llm:     {label:"LLM",     icon:"🤖",color:"var(--accent6)", tagClass:"tag-llm"},
  store:   {label:"오비서",  icon:"🏪",color:"#ec4899",       tagClass:"tag-store"}
};

function updateStats() {
  document.getElementById('totalCount').textContent = docs.length;
  document.getElementById('eduCount').textContent = docs.filter(d => d.cat === 'edu').length;
  document.getElementById('designCount').textContent = docs.filter(d => d.cat === 'design').length;
  document.getElementById('analysisCount').textContent = docs.filter(d => d.cat === 'analysis').length;
}

function autoTitle(file) {
  return file
    .replace(/^\d{8}_/, '')
    .replace(/_education\.html$/i, '')
    .replace(/_/g, ' ')
    .replace(/\b(ai|llm|rag|mcp|prd|ax|lora|llmops)\b/gi, word => word.toUpperCase());
}

async function mergeAutoEducationDocs() {
  try {
    const response = await fetch('/api/v1/project-docs/public-education-index', {
      credentials: 'same-origin',
      headers: { Accept: 'application/json' }
    });
    if (!response.ok) return;

    const payload = await response.json();
    const known = new Set(docs.map(doc => decodeURIComponent(doc.file)));
    const discovered = (Array.isArray(payload.documents) ? payload.documents : [])
      .filter(doc => doc && typeof doc.basename === 'string')
      .filter(doc => /^[A-Za-z0-9][A-Za-z0-9._-]*_education\.html$/.test(doc.basename))
      .filter(doc => !known.has(doc.basename));

    discovered.forEach(doc => {
      known.add(doc.basename);
      const size = Number.isFinite(doc.size) && doc.size >= 0 ? doc.size : 0;
      docs.unshift({
        cat: 'edu',
        title: autoTitle(doc.basename),
        file: doc.basename,
        date: /^\d{4}-\d{2}-\d{2}$/.test(doc.date || '') ? doc.date : '',
        size: `${Math.max(1, Math.round(size / 1024))}KB`,
        desc: '교육자료 인덱스에서 자동 검색된 문서'
      });
    });
  } catch (_) {
    // 공개·오프라인 접근에서는 검증된 정적 목록을 그대로 사용합니다.
  }
}

let currentFilter = 'all';

function setFilter(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.filter-bar button').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  filterDocs();
}

function filterDocs() {
  const q = document.getElementById('search').value.toLowerCase();
  const filtered = docs.filter(d => {
    if (currentFilter !== 'all' && d.cat !== currentFilter) return false;
    if (q) {
      const hay = (d.title + d.desc + d.date + catMeta[d.cat].label).toLowerCase();
      return hay.includes(q);
    }
    return true;
  });
  render(filtered);
}

function render(list) {
  const groups = {};
  const order = ['edu','design','mockup','analysis','biz','store'];
  order.forEach(c => { groups[c] = []; });
  list.forEach(d => { if (!groups[d.cat]) groups[d.cat]=[]; groups[d.cat].push(d); });

  let html = '';
  order.forEach(cat => {
    const items = groups[cat];
    if (!items || items.length === 0) return;
    const m = catMeta[cat];
    html += `<div class="section" data-cat="${cat}">
      <div class="section-header">
        <div class="section-icon" style="background:${m.color}20;color:${m.color}">${m.icon}</div>
        <h2>${m.label}</h2>
        <span class="count">${items.length}건</span>
      </div>
      <div class="grid">`;
    items.forEach(d => {
      const m2 = catMeta[d.cat];
      html += `<a class="card" href="${d.file}" target="_blank">
        <div class="title">${d.title}</div>
        <div style="font-size:.8rem;color:var(--text2);margin-bottom:4px">${d.desc}</div>
        <div class="meta">
          <span class="tag ${m2.tagClass}">${m2.label}</span>
          <span class="date">${d.date}</span>
          <span class="size">${d.size}</span>
        </div>
      </a>`;
    });
    html += '</div></div>';
  });

  if (!html) html = '<p style="text-align:center;color:var(--text2);padding:40px">검색 결과가 없습니다.</p>';
  document.getElementById('content').innerHTML = html;
}

updateStats();
filterDocs();

mergeAutoEducationDocs().then(() => {
  updateStats();
  filterDocs();
});
