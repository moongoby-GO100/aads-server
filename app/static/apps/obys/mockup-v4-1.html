    function renderRegisterV41(){const names=["등록 방식","파일·입력","매핑·검증","등록 결과"],c=configs[state.route],fields=registrationFields(c);document.getElementById("steps").innerHTML=names.map((x,i)=>`<div class="step ${i===state.step?'active':''}">${i+1}. ${x}</div>`).join("");let body="";
      if(state.step===0)body=`<div class="form-grid"><button class="form-field action-choice" id="excelMode"><label>엑셀·CSV 일괄등록</label><b>양식 다운로드 → 파일 선택 → 컬럼 매핑 → 오류 검증</b></button><button class="form-field action-choice" id="singleMode"><label>건별 직접입력</label><b>${fields.join(" · ")} 입력</b></button></div><p class="notice">자동연동 원문과 중복되지 않도록 원천번호·일자·금액·사업자 기준으로 검사합니다.</p>`;
      if(state.step===1&&state.registerMode==="excel")body=`<div class="dropzone"><div><b>등록할 엑셀·CSV 파일을 선택하세요.</b><p>xlsx, csv · 최대 10MB · 미리보기 후 DB 반영</p><input id="fileInput" type="file" accept=".xlsx,.csv"><p id="fileState">${state.importFile?`${escapeHtml(state.importFile.name)} · 검증 대기`:'아직 선택된 파일이 없습니다.'}</p></div></div><div class="form-grid" style="margin-top:10px"><div class="form-field"><label>사업자</label><select disabled><option>${escapeHtml(state.businessName)}</option></select></div><div class="form-field"><label>자료 기준일</label><input type="date" value="${state.dateTo}" disabled></div></div><div id="registerError" class="error-text"></div>`;
      if(state.step===1&&state.registerMode==="single")body=`<p class="notice">${c.title} 전용 필수항목입니다. 공통 거래폼으로 대체하지 않습니다.</p><div class="form-grid">${fields.map(fieldControl).join("")}</div><div id="registerError" class="error-text"></div>`;
      if(state.step===2&&state.registerMode==="excel"){const p=state.importPreview||{};body=`<p class="notice">서버가 파일 형식·필수값·중복을 실제 검증했습니다.</p>${Object.entries(p.mapping||{}).map(([target,source])=>`<div class="mapping"><span>${escapeHtml(source||'미인식')}</span><span>→</span><b>${escapeHtml(target)}</b></div>`).join("")}<div class="validation" style="margin-top:14px"><div><strong>${Number(p.accepted_rows||0)+Number(p.rejected_rows||0)+Number(p.duplicate_rows||0)}</strong><span>전체 행</span></div><div><strong style="color:var(--green)">${p.accepted_rows||0}</strong><span>정상</span></div><div><strong style="color:var(--red)">${Number(p.rejected_rows||0)+Number(p.duplicate_rows||0)}</strong><span>오류·중복</span></div></div>`}
      if(state.step===2&&state.registerMode==="single")body=`<p class="notice">입력값을 서버 저장 계약으로 변환했습니다.</p><div class="validation"><div><strong>1</strong><span>등록 대상</span></div><div><strong style="color:var(--green)">${escapeHtml(state.pendingManual?.occurred_on||"")}</strong><span>거래일</span></div><div><strong style="color:var(--green)">${Number(state.pendingManual?.total_amount||0).toLocaleString()}원</strong><span>합계</span></div></div><div class="focus-grid"><article class="focus-card"><b>거래처</b><span>${escapeHtml(state.pendingManual?.counterparty||"미입력")}</span></article><article class="focus-card"><b>적요</b><span>${escapeHtml(state.pendingManual?.description||"미입력")}</span></article><article class="focus-card"><b>사업자 귀속</b><span>${escapeHtml(state.businessName)}</span></article></div>`;
      if(state.step===3)body=`<div class="success-box"><h3>${state.registerMode==='excel'?`${state.importPreview?.accepted_rows||0}건`:'1건'} DB 등록 확인</h3><p>확정을 누르면 오비서 전용 DB의 현재 사업자 원장에 저장합니다.</p><p>중복 파일은 SHA-256과 원천 행 해시로 차단합니다.</p></div><div id="registerError" class="error-text"></div>`;
      document.getElementById("registerBody").innerHTML=body;document.getElementById("prevStep").disabled=state.step===0;document.getElementById("nextStep").textContent=state.step===3?"임시등록 확정":"다음";document.getElementById("nextStep").style.display=state.step===0?"none":"inline-block";document.getElementById("templateBtn").style.display=state.step===0||state.registerMode==="excel"?"inline-block":"none";
      document.getElementById("excelMode")?.addEventListener("click",()=>{state.registerMode="excel";state.step=1;renderRegisterV41()});document.getElementById("singleMode")?.addEventListener("click",()=>{state.registerMode="single";state.step=1;renderRegisterV41()});document.getElementById("fileInput")?.addEventListener("change",e=>{state.importFile=e.target.files[0]||null;state.fileSelected=!!state.importFile;document.getElementById("fileState").textContent=state.fileSelected?`${state.importFile.name} · 검증 대기`:"아직 선택된 파일이 없습니다."})
    }
    function manualPayload(){
      const pairs=[...document.querySelectorAll("[data-register-field]")].map(el=>[el.dataset.registerLabel,el.value.trim()]);
      const find=pattern=>pairs.find(([label,value])=>pattern.test(label)&&value)?.[1]||"";
      const amounts=pattern=>(find(pattern).match(/-?[0-9][0-9,.]*/g)||[]).map(x=>Number(x.replaceAll(",",""))).filter(Number.isFinite);
      const combined=amounts(/공급가액·세액|금액·증빙/),incoming=amounts(/입금액/)[0]||0,outgoing=amounts(/출금액/)[0]||0;
      let supply=amounts(/공급가/)[0]||combined[0]||0,tax=amounts(/세액/)[0]||combined[1]||0;
      const explicit=amounts(/결제금액|정산금액|미지급|분할금액|금액·증빙|입금액|출금액|금액$/)[0]||0;
      const occurred_on=find(/일자|일시/)||state.dateTo,total_amount=explicit||supply+tax,counterparty=find(/거래처|매입처|가맹점|입금처|채널/);
      const description=pairs.filter(([label])=>!/일자|일시|금액|공급가|세액|입금액|출금액|카드번호/.test(label)).map(([,value])=>value).filter(Boolean).join(" · ");
      if(!/^\d{4}-\d{2}-\d{2}$/.test(occurred_on))throw new Error("거래일자를 입력하십시오.");
      if(total_amount<=0)throw new Error("0원보다 큰 금액을 입력하십시오.");
      if(!supply&&!tax)supply=total_amount;
      if(supply+tax!==total_amount)throw new Error("합계는 공급가와 세액의 합이어야 합니다.");
      if(incoming>0&&outgoing>0)throw new Error("입금액과 출금액은 동시에 입력할 수 없습니다.");
      const cardDigits=find(/카드번호/).replace(/\D/g,"");
      return{occurred_on,counterparty,description,supply_amount:supply,tax_amount:tax,total_amount,card_last4:cardDigits.slice(-4),direction:incoming>0?"in":"out",account_label:find(/은행|계좌/)}
    }
    async function previewImport(){const form=new FormData();form.append("file",state.importFile);const payload=await workspaceApi(`/${encodeURIComponent(state.businessId)}/${encodeURIComponent(state.route)}/imports/preview`,{method:"POST",body:form});state.importPreview=payload.preview}
    async function commitImport(){const form=new FormData();form.append("file",state.importFile);form.append("expected_sha256",state.importPreview.sha256);return workspaceApi(`/${encodeURIComponent(state.businessId)}/${encodeURIComponent(state.route)}/imports/commit`,{method:"POST",body:form})}
    async function advanceRegisterV41(){const button=document.getElementById("nextStep");try{button.disabled=true;if(state.step===1){if(state.registerMode==="excel"){if(!state.importFile)throw new Error("파일을 선택해야 검증을 진행할 수 있습니다.");await previewImport()}else state.pendingManual=manualPayload();state.step=2;renderRegisterV41();return}if(state.step===2){state.step=3;renderRegisterV41();return}if(state.step===3){if(state.registerMode==="excel")await commitImport();else await workspaceApi(`/${encodeURIComponent(state.businessId)}/${encodeURIComponent(state.route)}/records`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(state.pendingManual)});registerDialog.close();state.tab="records";await loadLiveRoute();showToast("오비서 DB 등록과 목록 재조회가 완료되었습니다.")}}catch(error){const target=document.getElementById("registerError");if(target)target.textContent=error.message;else showToast(error.message)}finally{button.disabled=false}}
    function openHelpV41(){document.getElementById("detailTitle").textContent="V4.1 화면 사용 안내";document.getElementById("detailSubtitle").textContent="사용자의 첫 진입·반복 사용·실패 복구 흐름";document.getElementById("detailBody").innerHTML=`<div class="focus-grid"><article class="focus-card"><b>1. 현황 파악</b><span>업무별 KPI와 확인 필요 항목을 먼저 봅니다.</span></article><article class="focus-card"><b>2. 상세 탐색</b><span>사업자부터 원문 건별까지 계층을 순서대로 선택합니다.</span></article><article class="focus-card"><b>3. 처리·복구</b><span>행 상세에서 처리하거나 연동 실패 시 엑셀·직접등록으로 복구합니다.</span></article></div>`;document.getElementById("detailAction").textContent="안내 닫기";document.getElementById("detailAction").style.display="inline-block";state.detailRow=null;detailDialog.showModal()}
    function clearAuthAndOpenLogin(){localStorage.removeItem("aads_token");localStorage.removeItem("fb_access_token");document.cookie="aads_token=; path=/; max-age=0; SameSite=Lax";document.cookie="fb_access_token=; path=/; max-age=0; SameSite=Lax";window.location.replace("/static/apps/obys/index.html?legacy=1")}
    async function logoutV41(){try{await fetch("/api/v1/auth/logout",{method:"POST",credentials:"same-origin",headers:authHeaders()})}catch(_error){}clearAuthAndOpenLogin()}
    function renderSessionRecovery(message){document.getElementById("businessName").textContent="로그인이 필요합니다";document.getElementById("businessMeta").textContent="입력값은 브라우저에 남아 있으며 로그인 후 다시 조회할 수 있습니다.";page.innerHTML=`<section class="section"><div class="empty"><b>오비서 세션을 확인해 주세요.</b><p>${escapeHtml(message||"로그인 세션이 만료되었습니다.")}</p><button class="btn primary" id="loginRecoveryBtn">다시 로그인</button> <button class="btn" id="recoveryRetryBtn">다시 시도</button></div></section>`;document.getElementById("loginRecoveryBtn").onclick=clearAuthAndOpenLogin;document.getElementById("recoveryRetryBtn").onclick=()=>loadBusinesses().then(loadLiveRoute).catch(handleStartupError)}
    function handleStartupError(error){state.liveError=error.message;state.sourceFailed=true;if(Number(error.status)===401){renderSessionRecovery(error.message);return}renderPageV41()}
    renderPage=renderPageV41;openDetail=openDetailV41;openRegister=openRegisterV41;renderRegister=renderRegisterV41;
    nav.onclick=e=>{const title=e.target.closest(".group-title");if(title){const g=title.closest(".group");g.classList.toggle("open");title.setAttribute("aria-expanded",g.classList.contains("open"));return}const item=e.target.closest("[data-route]");if(item){state.route=item.dataset.route;state.search="";state.status="전체 상태";state.tab="summary";state.selected={};state.sourceFailed=false;state.liveMetrics=[];state.liveSource=null;history.replaceState(null,"",`#${state.route}`);side.classList.remove("show");backdrop.classList.remove("show");loadLiveRoute()}};
    document.getElementById("quickRegister").onclick=()=>{if(configs[state.route].register)openRegisterV41();else{state.route="tax-gap";history.replaceState(null,"","#tax-gap");loadLiveRoute().then(openRegisterV41)}};document.getElementById("helpBtn").onclick=openHelpV41;document.getElementById("prevStep").onclick=()=>{state.step=Math.max(0,state.step-1);renderRegisterV41()};document.getElementById("nextStep").onclick=advanceRegisterV41;document.getElementById("templateBtn").onclick=()=>downloadCsv([],registrationFields(configs[state.route]),`${state.route}-template.csv`);document.getElementById("detailAction").onclick=()=>detailDialog.close();
    document.getElementById("legacyBtn").onclick=()=>window.location.href="/static/apps/obys/index.html?legacy=1";document.getElementById("logoutBtn").onclick=logoutV41;
    const initial=location.hash.slice(1);state.route=configs[initial]?initial:"home";renderPageV41();loadBusinesses().then(loadLiveRoute).catch(handleStartupError);
  </script>
</body>
