      document.getElementById("steps").innerHTML=names.map((x,i)=>`<div class="step ${i===state.step?"active":""}">${i+1}. ${x}</div>`).join("");
      let body="";
      if(state.step===0)body=`<div class="form-grid"><button class="form-field action-choice" id="excelMode"><label>엑셀·CSV 일괄등록</label><b>양식 다운로드 → 파일 선택 → 컬럼 매핑 → 오류 검증</b></button><button class="form-field action-choice" id="singleMode"><label>건별 직접입력</label><b>${escapeHtml(fields.join(" · "))} 입력</b></button></div><p class="notice">등록 API(POST /api/v1/import-sessions)는 아직 없습니다. 이 화면은 파일 검증까지만 실제로 수행하고 임시등록은 보내지 않습니다.</p>`;
      if(state.step===1&&state.registerMode==="excel")body=`<div class="dropzone"><div><b>등록할 엑셀·CSV 또는 증빙 파일을 선택하세요.</b><p>xlsx, csv, pdf, jpg · 최대 20MB</p><input id="fileInput" type="file" accept=".xlsx,.csv,.pdf,.jpg,.jpeg,.png"><p id="fileState">${state.fileSelected?escapeHtml(`${state.fileName} · 검증 대기`):"아직 선택된 파일이 없습니다."}</p></div></div><div class="form-grid" style="margin-top:10px"><div class="form-field"><label>사업자</label><input value="${escapeHtml(state.biz?plain(state.biz.name||state.biz.business_name||state.biz.id):"사업자 미확인")}" readonly aria-label="사업자"></div><div class="form-field"><label>자료 기준일</label><input type="date" id="baseDate" value="" aria-label="자료 기준일"></div></div><div id="registerError" class="error-text"></div>`;
      if(state.step===1&&state.registerMode==="single")body=`<p class="notice">${escapeHtml(c.title)} 전용 필수항목입니다. 공통 거래폼으로 대체하지 않습니다.</p><div class="form-grid">${fields.map(fieldControl).join("")}</div><div id="registerError" class="error-text"></div>`;
      if(state.step===2&&state.registerMode==="excel"){
        const r=state.fileReport;
        const summary=r&&!r.reason?`<div class="validation" style="margin-top:14px"><div><strong>${r.total}</strong><span>전체 행</span></div><div><strong style="color:var(--green)">${r.ok}</strong><span>정상</span></div><div><strong style="color:var(--red)">${r.bad}</strong><span>오류·빈 행</span></div></div>`:`<p class="notice">${escapeHtml(r?r.reason:"CSV가 아니어서 브라우저에서 행을 셀 수 없습니다. 서버 파싱(import-session API)이 필요합니다.")}</p>`;
        const mapping=(r&&r.header.length?r.header:fields).slice(0,6).map((x,i)=>`<div class="mapping"><select><option>${escapeHtml(x)}</option></select><span>→</span><select><option>${escapeHtml(fields[i]||"매핑 대상 없음")}</option></select></div>`).join("");
        body=`<p class="notice">원본 컬럼과 업무 필드를 확인하십시오. 아래 수치는 선택한 파일을 실제로 읽어 센 값입니다.</p>${mapping}${summary}`;
      }
      if(state.step===2&&state.registerMode==="single"){
        const values=[...document.querySelectorAll("[data-register-field]")].map(el=>el.value.trim());
        const filled=values.filter(Boolean).length;
        body=`<p class="notice">입력값 검증 결과입니다.</p><div class="validation"><div><strong>${filled}</strong><span>입력된 필수값</span></div><div><strong style="color:${filled===fields.length?"var(--green)":"var(--red)"}">${fields.length-filled}</strong><span>미입력</span></div><div><strong>미검증</strong><span>중복·귀속(서버 검증 필요)</span></div></div>`;
      }
      if(state.step===3)body=`<div class="notice">임시등록을 보내지 않았습니다. 이 화면이 실제 등록을 수행하려면 POST /api/v1/import-sessions → /validate → /commit 세 개가 필요하며, 현재 서버에 없습니다.<br>원본 해시·업로더·컬럼 매핑·검증결과·승인자는 그 API의 감사 이벤트로 남겨야 합니다.</div>`;
      document.getElementById("registerBody").innerHTML=body;
      document.getElementById("prevStep").disabled=state.step===0;
      document.getElementById("nextStep").textContent=state.step===3?"닫기":"다음";
      document.getElementById("nextStep").style.display=state.step===0?"none":"inline-block";
      document.getElementById("templateBtn").style.display=state.step===0||state.registerMode==="excel"?"inline-block":"none";
      document.getElementById("excelMode")?.addEventListener("click",()=>{state.registerMode="excel";state.step=1;renderRegister()});
      document.getElementById("singleMode")?.addEventListener("click",()=>{state.registerMode="single";state.step=1;renderRegister()});
      document.getElementById("fileInput")?.addEventListener("change",e=>{
        const file=e.target.files[0];
        state.fileSelected=!!file;state.fileName=file?file.name:"";state.fileReport=null;
        document.getElementById("fileState").textContent=file?`${file.name} · ${file.size.toLocaleString()}바이트 · 검증 대기`:"아직 선택된 파일이 없습니다.";
        if(file&&/\.csv$/i.test(file.name)){const reader=new FileReader();reader.onload=()=>{state.fileReport=parseCsv(String(reader.result),registrationFields(cfg()))};reader.readAsText(file,"utf-8")}
        else if(file){state.fileReport={total:0,ok:0,bad:0,header:[],reason:"CSV가 아니어서 브라우저에서 행을 셀 수 없습니다. 서버 파싱(import-session API)이 필요합니다."}}
      });
    }
    function advanceRegister(){
      if(state.step===3){registerDialog.close();return}
      if(state.step===1&&state.registerMode==="excel"&&!state.fileSelected){document.getElementById("registerError").textContent="파일을 선택해야 컬럼 매핑과 검증을 진행할 수 있습니다.";return}
      if(state.step===1&&state.registerMode==="single"){
        const inputs=[...document.querySelectorAll("[data-register-field]")];
        if(inputs.some(el=>!el.value.trim())){document.getElementById("registerError").textContent="필수값을 모두 입력해야 다음 단계로 넘어갑니다.";return}
      }
      state.step++;renderRegister();
    }
    function downloadCsv(rows,columns,name){
      const csv=[columns.join(","),...rows.map(r=>columns.map(col=>`"${cellValue(r,col).replaceAll('"','""')}"`).join(","))].join("\n");
      const a=document.createElement("a");
      a.href=URL.createObjectURL(new Blob(["﻿"+csv],{type:"text/csv"}));
      a.download=name;a.click();
      setTimeout(()=>URL.revokeObjectURL(a.href),1000);
      showToast(rows.length?`${rows.length}건을 CSV로 만들었습니다.`:"헤더만 있는 빈 CSV를 만들었습니다.");
    }
    function openHelp(){
      document.getElementById("detailTitle").textContent="V4.1 화면 사용 안내";
      document.getElementById("detailSubtitle").textContent="첫 진입 · 반복 사용 · 실패 복구";
      document.getElementById("detailBody").innerHTML=`<div class="focus-grid"><article class="focus-card"><b>1. 원천 확인</b><span>화면 상단의 원천 계약 줄에서 어떤 API와 테이블을 보고 있는지 확인합니다.</span></article><article class="focus-card"><b>2. 상세 탐색</b><span>조회된 값이 있는 단계만 선택됩니다. 값이 없으면 안내가 뜹니다.</span></article><article class="focus-card"><b>3. 복구</b><span>미연동·차단·0건이면 다시 조회하거나 엑셀·직접 등록으로 우회합니다.</span></article></div><div class="notice">이 화면은 샘플 데이터를 두지 않습니다. 숫자가 보이지 않으면 원천이 없거나 접근이 막힌 것입니다.</div>`;
      document.getElementById("detailAction").textContent="안내 닫기";
      document.getElementById("detailAction").style.display="inline-block";
      state.detailRow=null;
      detailDialog.showModal();
    }
    renderNav();
    nav.onclick=e=>{
      const title=e.target.closest(".group-title");
      if(title){const g=title.closest(".group");g.classList.toggle("open");title.setAttribute("aria-expanded",g.classList.contains("open"));return}
      const item=e.target.closest("[data-route]");
      if(item){state.route=item.dataset.route;state.search="";state.status="전체 상태";state.tab="summary";state.selected={};history.replaceState(null,"",`#${state.route}`);side.classList.remove("show");backdrop.classList.remove("show");loadRoute()}
    };
    document.getElementById("bizBox").onclick=()=>{
      if(state.bizList.length<2)return;
      const i=state.bizList.indexOf(state.biz);
      state.biz=state.bizList[(i+1)%state.bizList.length];
      renderBusiness();loadRoute();
    };
    document.getElementById("menuToggle").onclick=()=>{side.classList.add("show");backdrop.classList.add("show")};
    backdrop.onclick=()=>{side.classList.remove("show");backdrop.classList.remove("show")};
    document.querySelectorAll("[data-close]").forEach(b=>b.onclick=()=>document.getElementById(b.dataset.close).close());
    document.getElementById("quickRegister").onclick=()=>{if(cfg().register)openRegister();else{state.route="tax-gap";history.replaceState(null,"","#tax-gap");loadRoute();openRegister()}};
    document.getElementById("helpBtn").onclick=openHelp;
    document.getElementById("prevStep").onclick=()=>{state.step=Math.max(0,state.step-1);renderRegister()};
    document.getElementById("nextStep").onclick=advanceRegister;
    document.getElementById("templateBtn").onclick=()=>downloadCsv([],registrationFields(cfg()),`${state.route}-template.csv`);
    document.getElementById("detailAction").onclick=()=>state.detailRow?openDetailAction():detailDialog.close();
    const initial=location.hash.slice(1);
    state.route=configs[initial]?initial:"home";
    renderPage();
    loadBusinesses().then(loadRoute);
  </script>
</body>
</html>
