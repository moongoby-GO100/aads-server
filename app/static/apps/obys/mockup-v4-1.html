    }
    function openDetailV41(row,c){state.detailRow=row;document.getElementById("detailTitle").textContent=`${c.title} · 건별 상세`;document.getElementById("detailSubtitle").textContent=`${c.hierarchy.join(" → ")} 기준 원문과 처리 이력`;document.getElementById("detailBody").innerHTML=`<div class="detail-grid">${Object.entries(row).map(([k,v])=>`<div class="detail-cell"><small>${k}</small><b>${v}</b></div>`).join("")}</div><div class="section"><div class="section-head"><h2>원문·연결·감사 이력</h2></div><div class="focus-grid"><article class="focus-card"><b>원문 자료</b><span>${state.route.includes('tax')||state.route==='journals'?'증빙 원본, 발행·승인번호, 공급가·세액 검증':'자동연동 원문, 수집시각, 파일 해시'}를 보존합니다.</span></article><article class="focus-card"><b>업무 연결</b><span>${c.hierarchy.join(" → ")}</span></article><article class="focus-card"><b>처리 이력</b><span>10:12 수집 · 10:14 자동검증 · 담당자 확인 대기</span></article></div></div><div id="detailActionPanel"></div>`;document.getElementById("detailAction").textContent=c.action;document.getElementById("detailAction").style.display="inline-block";detailDialog.showModal()}
    function openDetailActionV41(){const c=configs[state.route],panel=document.getElementById("detailActionPanel");if(!panel){detailDialog.close();return}panel.innerHTML=`<div class="action-panel"><h3>${c.action}</h3><p>처리 결과와 근거가 감사 이력에 남습니다. 확정 전에는 언제든 취소할 수 있습니다.</p><div class="action-row"><select class="field" id="actionStatus"><option>검토 완료</option><option>보완 요청</option><option>${state.route==='journals'?'역분개 요청':'승인 요청'}</option></select><input class="field" id="actionReason" value="원문과 연결 자료 확인 완료" aria-label="처리 사유"><button class="btn primary" id="confirmAction">처리 저장</button></div></div>`;document.getElementById("detailAction").style.display="none";document.getElementById("confirmAction").onclick=()=>{const keys=Object.keys(state.detailRow||{});if(keys.length)state.detailRow[keys[keys.length-1]]=document.getElementById("actionStatus").value;panel.innerHTML=`<div class="success-box"><h3>처리 결과가 저장되었습니다.</h3><p>${escapeHtml(document.getElementById("actionReason")?.value||"처리 근거 저장 완료")}</p><p>변경 전후 값과 담당자·시각을 감사 이력에 남겼습니다.</p></div>`;showToast("건별 처리와 감사 이력을 저장했습니다.")}}
    function openRegisterV41(){state.step=0;state.registerMode=null;state.fileSelected=false;document.getElementById("registerTitle").textContent=`${configs[state.route].title} 자료 등록`;renderRegisterV41();registerDialog.showModal()}
    function renderRegisterV41(){const names=["등록 방식","파일·입력","매핑·검증","등록 결과"],c=configs[state.route],fields=registrationFields(c);document.getElementById("steps").innerHTML=names.map((x,i)=>`<div class="step ${i===state.step?'active':''}">${i+1}. ${x}</div>`).join("");let body="";
      if(state.step===0)body=`<div class="form-grid"><button class="form-field action-choice" id="excelMode"><label>엑셀·CSV 일괄등록</label><b>양식 다운로드 → 파일 선택 → 컬럼 매핑 → 오류 검증</b></button><button class="form-field action-choice" id="singleMode"><label>건별 직접입력</label><b>${fields.join(" · ")} 입력</b></button></div><p class="notice">자동연동 원문과 중복되지 않도록 원천번호·일자·금액·사업자 기준으로 검사합니다.</p>`;
      if(state.step===1&&state.registerMode==="excel")body=`<div class="dropzone"><div><b>등록할 엑셀·CSV 또는 증빙 파일을 선택하세요.</b><p>xlsx, csv, pdf, jpg · 최대 20MB</p><input id="fileInput" type="file" accept=".xlsx,.csv,.pdf,.jpg,.jpeg,.png"><p id="fileState">아직 선택된 파일이 없습니다.</p></div></div><div class="form-grid" style="margin-top:10px"><div class="form-field"><label>사업자</label><select><option>열정국밥 주식회사</option></select></div><div class="form-field"><label>자료 기준일</label><input type="date" value="2026-09-22"></div></div><div id="registerError" class="error-text"></div>`;
      if(state.step===1&&state.registerMode==="single")body=`<p class="notice">${c.title} 전용 필수항목입니다. 공통 거래폼으로 대체하지 않습니다.</p><div class="form-grid">${fields.map(fieldControl).join("")}</div><div id="registerError" class="error-text"></div>`;
      if(state.step===2&&state.registerMode==="excel")body=`<p class="notice">필수 필드와 원본 컬럼을 확인하십시오. 오류 행만 내려받아 다시 등록할 수 있습니다.</p>${fields.slice(0,6).map((x,i)=>`<div class="mapping"><select><option>원본 ${String.fromCharCode(65+i)}열</option></select><span>→</span><select><option>${x}</option></select></div>`).join("")}<div class="validation" style="margin-top:14px"><div><strong>128</strong><span>전체 행</span></div><div><strong style="color:var(--green)">124</strong><span>정상</span></div><div><strong style="color:var(--red)">4</strong><span>오류·중복</span></div></div><button class="btn" id="errorRows">오류 4건 내려받기</button>`;
      if(state.step===2&&state.registerMode==="single")body=`<p class="notice">업무 규칙 검증 결과입니다.</p><div class="validation"><div><strong>${fields.length}</strong><span>필수값 정상</span></div><div><strong style="color:var(--green)">0</strong><span>중복 원천번호</span></div><div><strong style="color:var(--green)">일치</strong><span>${state.route==='journals'?'차변·대변':'사업자 귀속'}</span></div></div><div class="focus-grid">${fields.slice(0,3).map(x=>`<article class="focus-card"><b>${x}</b><span>입력값·형식·업무 귀속 검증 완료</span></article>`).join("")}</div>`;
      if(state.step===3)body=`<div class="success-box"><h3>${state.registerMode==='excel'?'정상 124건':'1건'} 임시등록 준비 완료</h3><p>${state.registerMode==='excel'?'오류 4건은 제외하고 정상 건만':'입력한 건을'} 임시 상태로 저장합니다.</p><p>승인 전까지 원장·신고·정산 확정값에는 반영되지 않습니다.</p></div>`;
      document.getElementById("registerBody").innerHTML=body;document.getElementById("prevStep").disabled=state.step===0;document.getElementById("nextStep").textContent=state.step===3?"임시등록 확정":"다음";document.getElementById("nextStep").style.display=state.step===0?"none":"inline-block";document.getElementById("templateBtn").style.display=state.step===0||state.registerMode==="excel"?"inline-block":"none";
      document.getElementById("excelMode")?.addEventListener("click",()=>{state.registerMode="excel";state.step=1;renderRegisterV41()});document.getElementById("singleMode")?.addEventListener("click",()=>{state.registerMode="single";state.step=1;renderRegisterV41()});document.getElementById("fileInput")?.addEventListener("change",e=>{state.fileSelected=!!e.target.files.length;document.getElementById("fileState").textContent=state.fileSelected?`${e.target.files[0].name} · 검증 대기`:"아직 선택된 파일이 없습니다."});document.getElementById("errorRows")?.addEventListener("click",()=>downloadCsv([],fields,`${state.route}-errors.csv`))
    }
    function advanceRegisterV41(){if(state.step===1&&state.registerMode==="excel"&&!state.fileSelected){document.getElementById("registerError").textContent="파일을 선택해야 컬럼 매핑과 검증을 진행할 수 있습니다.";return}if(state.step<3){state.step++;renderRegisterV41();return}const c=configs[state.route],record=Object.fromEntries(c.columns.map((x,i)=>[x,i===c.columns.length-1?"임시등록":i===0?`${state.route.toUpperCase()}-NEW`:levelChoice(x)]));c.data.unshift(record);registerDialog.close();state.tab="records";renderPageV41();showToast(`${state.registerMode==='excel'?'124건':'1건'}이 임시등록되었습니다. 승인 전까지 확정값에 반영되지 않습니다.`)}
    function openHelpV41(){document.getElementById("detailTitle").textContent="V4.1 화면 사용 안내";document.getElementById("detailSubtitle").textContent="사용자의 첫 진입·반복 사용·실패 복구 흐름";document.getElementById("detailBody").innerHTML=`<div class="focus-grid"><article class="focus-card"><b>1. 현황 파악</b><span>업무별 KPI와 확인 필요 항목을 먼저 봅니다.</span></article><article class="focus-card"><b>2. 상세 탐색</b><span>사업자부터 원문 건별까지 계층을 순서대로 선택합니다.</span></article><article class="focus-card"><b>3. 처리·복구</b><span>행 상세에서 처리하거나 연동 실패 시 엑셀·직접등록으로 복구합니다.</span></article></div>`;document.getElementById("detailAction").textContent="안내 닫기";document.getElementById("detailAction").style.display="inline-block";state.detailRow=null;detailDialog.showModal()}
    renderPage=renderPageV41;openDetail=openDetailV41;openRegister=openRegisterV41;renderRegister=renderRegisterV41;
    nav.onclick=e=>{const title=e.target.closest(".group-title");if(title){const g=title.closest(".group");g.classList.toggle("open");title.setAttribute("aria-expanded",g.classList.contains("open"));return}const item=e.target.closest("[data-route]");if(item){state.route=item.dataset.route;state.search="";state.status="전체 상태";state.tab="summary";state.selected={};state.sourceFailed=false;history.replaceState(null,"",`#${state.route}`);side.classList.remove("show");backdrop.classList.remove("show");renderPageV41()}};
    document.getElementById("quickRegister").onclick=()=>{if(configs[state.route].register)openRegisterV41();else{state.route="tax-gap";history.replaceState(null,"","#tax-gap");renderPageV41();openRegisterV41()}};document.getElementById("helpBtn").onclick=openHelpV41;document.getElementById("prevStep").onclick=()=>{state.step=Math.max(0,state.step-1);renderRegisterV41()};document.getElementById("nextStep").onclick=advanceRegisterV41;document.getElementById("templateBtn").onclick=()=>downloadCsv([],registrationFields(configs[state.route]),`${state.route}-template.csv`);document.getElementById("detailAction").onclick=()=>state.detailRow?openDetailActionV41():detailDialog.close();
    const initial=location.hash.slice(1);state.route=configs[initial]?initial:"home";renderPageV41();
  </script>
</body>
