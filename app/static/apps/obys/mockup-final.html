    const stateScreens={empty:["○","아직 표시할 자료가 없습니다.","수집 연동을 연결하거나 증빙 파일을 올리면 여기에서 업무 흐름을 확인할 수 있습니다.","수집 시작","go-collect"],error:["!","연동에 실패했습니다.","홈택스 연결이 만료되었습니다. 다시 로그인하거나 파일 업로드로 업무를 계속하세요.","다시 시도","retry"],expired:["↻","세션이 만료되었습니다.","안전한 사용을 위해 로그인이 종료되었습니다. 저장된 화면 상태는 로그인 후 복원됩니다.","다시 로그인","login"],denied:["×","이 업무를 볼 권한이 없습니다.","대표 관리자에게 ‘회계 검토’ 권한을 요청하거나 접근 가능한 화면으로 돌아가세요.","권한 요청","request-access"],offline:["⌁","현재 오프라인입니다.","마지막으로 본 화면을 표시했습니다. 네트워크가 복구되면 다시 시도할 수 있습니다.","연결 재시도","retry-network"]};
    function showToast(message){toast.textContent=message;toast.classList.add("show");clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove("show"),2600)}
    function render(){const state=stateSelect.value;if(state==="loading"){root.innerHTML=`<section class="state-screen" aria-busy="true"><div class="skeleton"><i></i><i></i><i></i><i></i></div><p>자료를 불러오는 중입니다…</p></section>`}else if(state!=="normal"){const s=stateScreens[state];root.innerHTML=`<section class="state-screen"><div class="state-icon">${s[0]}</div><h2>${s[1]}</h2><p>${s[2]}</p><button type="button" class="btn primary" data-action="${s[4]}">${s[3]}</button>${state==="error"?'<button type="button" class="btn" style="margin-top:8px" data-action="upload">파일 업로드로 대체</button>':''}</section>`}else root.innerHTML=views[currentView].render();title.textContent=views[currentView].title;document.querySelectorAll("[data-view]").forEach(el=>el.classList.toggle("active",el.dataset.view===currentView))}
    function switchView(view){if(!views[view])return;currentView=view;stateSelect.value="normal";location.hash=view;render();sidebar.classList.remove("open");sheet.classList.remove("open");window.scrollTo({top:0,behavior:"smooth"})}
    function openDrawer(action){const specs={"transaction-detail":["거래 상세","배달의민족 정산 · 샘플 데이터",[["거래일","2026-09-18"],["공급가액","₩4,280,000"],["증빙","카드 정산서 연결"],["전표","ACCT-2026-0918-042"],["상태","수집 완료 · 전표 확정"]]],"ledger-detail":["전표 검토","ACCT 반영 전 초안 · 샘플 데이터",[["차변","원재료비 ₩1,842,000"],["대변","미지급금 ₩1,842,000"],["차대 검증","일치"],["증빙","서울축산 전자세금계산서"],["다음 단계","회계담당 승인 후 정본 반영"]]],"approval-detail":["승인 상세","근거를 확인한 뒤 처리하세요.",[["업무","3분기 매출 신고자료"],["기간","2026-07-01~09-30"],["요청자","김회계 담당"],["누락","2건 · 현재 신고 차단"],["변경 이력","9월 21일 검토 완료"]]],"duplicate-detail":["중복 검토","원본은 삭제하지 않고 제외 처리합니다.",[["파일","법인카드_0917_02.jpg"],["중복 후보","카드 승인 9284"],["금액","₩84,000"],["신뢰도","98% · 샘플"]]],"settings-detail":["설정 상세","실제 저장 없이 UI만 동작합니다.",[["사업자","열정에프앤비 주식회사"],["역할","대표 관리자"],["최근 변경","2026-09-20 16:42"],["상태","검토됨"]]]};const s=specs[action]||["알림","최근 업무 알림 · 샘플 데이터",[["연동 오류","홈택스 세션 만료"],["승인 대기","6건"],["마감","오늘 2건"]]];drawerTitle.textContent=s[0];drawerSubtitle.textContent=s[1];drawerBody.innerHTML=`<div class="detail-grid">${s[2].map(x=>`<div class="detail"><small>${x[0]}</small><strong>${x[1]}</strong></div>`).join("")}</div><div class="actions" style="margin-top:18px"><button type="button" class="btn" data-action="close-drawer">닫기</button><button type="button" class="btn primary" data-action="confirm">확인</button></div><div class="notice" style="margin-top:16px"><strong>샘플</strong><span>이 작업은 실제 API 호출이나 DB 쓰기를 수행하지 않습니다.</span></div>`;drawer.classList.add("open");drawer.setAttribute("aria-hidden","false");drawer.querySelector(".close").focus()}
    document.addEventListener("click",e=>{const view=e.target.closest("[data-view]");if(view){switchView(view.dataset.view);return}const target=e.target.closest("[data-action]");if(!target)return;const a=target.dataset.action;if(a==="menu"){sidebar.classList.add("open");sheet.classList.add("open")}else if(a==="close-menu"){sidebar.classList.remove("open");sheet.classList.remove("open")}else if(a==="close-drawer"||a==="confirm"){drawer.classList.remove("open");drawer.setAttribute("aria-hidden","true");if(a==="confirm")showToast("목업에서 확인 처리했습니다. 실제 데이터는 변경되지 않았습니다.")}else if(a==="go-collect")switchView("collect");else if(a==="go-approvals")switchView("approvals");else if(a==="upload"){document.getElementById("mockFile")?.click();showToast("파일 선택 동작을 확인하세요. 실제 업로드는 수행하지 않습니다.")}else if(["transaction-detail","ledger-detail","approval-detail","duplicate-detail","settings-detail","notifications"].includes(a))openDrawer(a);else if(a==="retry"||a==="retry-network"){stateSelect.value="loading";render();setTimeout(()=>{stateSelect.value="normal";render();showToast("재시도 시뮬레이션이 완료되었습니다.")},700)}else if(a==="login")showToast("로그인 화면 연결 예정 · 화면 상태는 보존됩니다.");else if(a==="request-access")showToast("대표 관리자에게 권한 요청을 보냈습니다. (목업)");else showToast("‘"+target.textContent.trim()+"’ 동작을 확인했습니다. 실제 저장은 하지 않습니다.")});
    document.addEventListener("submit",e=>{if(e.target.matches("[data-filter-form]")){e.preventDefault();showToast("선택한 기간과 사업자로 조회했습니다. (샘플)")}});
    stateSelect.addEventListener("change",render);drawer.addEventListener("click",e=>{if(e.target===drawer){drawer.classList.remove("open");drawer.setAttribute("aria-hidden","true")}});document.addEventListener("keydown",e=>{if(e.key==="Escape"){drawer.classList.remove("open");sidebar.classList.remove("open");sheet.classList.remove("open")}});
    const initial=location.hash.slice(1);if(views[initial])currentView=initial;render();
  })();
  </script>
