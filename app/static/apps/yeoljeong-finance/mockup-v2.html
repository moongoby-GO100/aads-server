<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111827">
  <title>매장비서 · 통합 경영 대시보드 시안</title>
  <style>
    :root {
      color-scheme: light;
      --nav: #111827;
      --nav-soft: #1f2937;
      --page: #f4f5f7;
      --card: #fff;
      --ink: #171a21;
      --muted: #68707f;
      --line: #e5e7eb;
      --orange: #f26a2e;
      --orange-soft: #fff2ea;
      --green: #15936b;
      --green-soft: #eaf8f2;
      --red: #dc4c4c;
      --red-soft: #fff0f0;
      --blue: #3778d4;
      --blue-soft: #edf4ff;
      --amber: #b7791f;
      --amber-soft: #fff8e5;
      --shadow: 0 1px 2px rgba(16,24,40,.04), 0 8px 24px rgba(16,24,40,.06);
      font-family: Pretendard, "Noto Sans KR", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }
    * { box-sizing: border-box; }
    html { overflow-x: hidden; }
    body { margin: 0; min-width: 320px; overflow-x: hidden; background: var(--page); color: var(--ink); }
    button, select, input, textarea { font: inherit; }
    button { cursor: pointer; }
    .app { min-height: 100vh; display: grid; grid-template-columns: 228px minmax(0, 1fr); }
    .sidebar {
      position: sticky; top: 0; z-index: 20; height: 100vh;
      display: flex; flex-direction: column; background: var(--nav); color: #fff;
      border-right: 1px solid rgba(255,255,255,.05);
    }
    .brand { height: 72px; display: flex; align-items: center; gap: 11px; padding: 0 22px; font-weight: 850; font-size: 18px; }
    .brand-mark { width: 31px; height: 31px; display: grid; place-items: center; border-radius: 9px; background: var(--orange); font-size: 16px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
    .workspace { margin: 0 13px 15px; padding: 12px; border: 1px solid rgba(255,255,255,.12); background: rgba(255,255,255,.06); border-radius: 10px; }
    .workspace-label { margin-bottom: 7px; font-size: 10px; color: #9ca3af; font-weight: 750; letter-spacing: .7px; }
    .workspace button { width: 100%; padding: 0; border: 0; color: #fff; background: transparent; display: flex; align-items: center; gap: 9px; text-align: left; }
    .workspace-logo { width: 28px; height: 28px; border-radius: 7px; display: grid; place-items: center; background: #fff; color: var(--nav); font-size: 12px; font-weight: 900; }
    .workspace-name { min-width: 0; flex: 1; }
    .workspace-name b, .workspace-name span { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .workspace-name b { font-size: 13px; }
    .workspace-name span { color: #9ca3af; font-size: 11px; margin-top: 2px; }
    .nav { display: grid; gap: 4px; padding: 0 10px; }
    .nav-label { padding: 13px 12px 5px; color: #747d8d; font-size: 10px; font-weight: 800; letter-spacing: 1px; }
    .nav button { position: relative; width: 100%; height: 43px; border: 0; border-radius: 8px; background: transparent; color: #aeb5c1; display: flex; align-items: center; gap: 12px; padding: 0 12px; font-size: 13px; font-weight: 700; text-align: left; }
    .nav button:hover { background: rgba(255,255,255,.05); color: #fff; }
    .nav button.active { color: #fff; background: var(--nav-soft); }
    .nav button.active::before { content: ""; position: absolute; left: 0; top: 11px; bottom: 11px; width: 3px; border-radius: 3px; background: var(--orange); }
    .nav svg, .bottom-nav svg, .topbar svg { width: 18px; height: 18px; stroke-width: 1.8; }
    .count { margin-left: auto; min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; display: grid; place-items: center; background: #3b2524; color: #ffb08a; font-size: 10px; }
    .sidebar-bottom { margin-top: auto; padding: 16px 18px; border-top: 1px solid rgba(255,255,255,.07); color: #858d9a; font-size: 11px; line-height: 1.5; }
    .main { min-width: 0; }
    .topbar { position: sticky; top: 0; z-index: 15; height: 72px; padding: 0 28px; background: rgba(255,255,255,.94); border-bottom: 1px solid var(--line); backdrop-filter: blur(12px); display: flex; align-items: center; justify-content: space-between; gap: 16px; }
    .top-left, .top-right, .profile { display: flex; align-items: center; }
    .top-left { gap: 13px; min-width: 0; }
    .top-left h1 { margin: 0; font-size: 19px; white-space: nowrap; }
    .prototype { padding: 5px 8px; border: 1px solid #f3cdbb; border-radius: 5px; background: var(--orange-soft); color: #a8461b; font-size: 10px; font-weight: 800; white-space: nowrap; }
    .top-right { gap: 9px; }
    .topbar button { width: 38px; height: 38px; padding: 0; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 9px; background: #fff; color: #555e6e; }
    .profile { gap: 9px; margin-left: 5px; padding-left: 14px; border-left: 1px solid var(--line); }
    .avatar { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 50%; background: #ede7e1; color: #694b37; font-size: 11px; font-weight: 900; }
    .profile b, .profile span { display: block; }
    .profile b { font-size: 12px; }
    .profile span { color: var(--muted); font-size: 10px; margin-top: 2px; }
    .mobile-menu { display: none !important; }
    .content { max-width: 1520px; margin: 0 auto; padding: 26px 28px 52px; }
    .mobile-switch { display: none; }
    .hero { display: flex; justify-content: space-between; gap: 20px; align-items: flex-end; margin-bottom: 20px; }
    .hero h2 { margin: 0 0 6px; font-size: 24px; letter-spacing: -.4px; }
    .hero p { margin: 0; color: var(--muted); font-size: 13px; }
    .hero-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; justify-content: flex-end; }
    .select, .outline, .primary, .chip-btn { min-height: 38px; padding: 0 13px; border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink); font-size: 12px; font-weight: 750; }
    .primary { border-color: var(--nav); background: var(--nav); color: #fff; }
    .outline:hover, .chip-btn:hover, .topbar button:hover { border-color: var(--orange); color: var(--orange); }
    .kpis { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 13px; margin-bottom: 14px; }
    .card { min-width: 0; background: var(--card); border: 1px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); }
    .kpi { min-height: 126px; padding: 18px; overflow: hidden; }
    .kpi-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
    .kpi-label { color: var(--muted); font-size: 12px; font-weight: 750; }
    .kpi-icon { width: 34px; height: 34px; display: grid; place-items: center; border-radius: 9px; }
    .kpi-icon.orange { background: var(--orange-soft); color: var(--orange); }
    .kpi-icon.green { background: var(--green-soft); color: var(--green); }
    .kpi-icon.blue { background: var(--blue-soft); color: var(--blue); }
    .kpi-icon.amber { background: var(--amber-soft); color: var(--amber); }
    .kpi-value { margin-top: 13px; font-size: 25px; font-weight: 880; letter-spacing: -.4px; overflow-wrap: anywhere; }
    .kpi-foot { display: flex; align-items: center; gap: 7px; margin-top: 7px; color: var(--muted); font-size: 11px; flex-wrap: wrap; }
    .up { color: var(--green); font-weight: 800; }
    .down { color: var(--red); font-weight: 800; }
    .grid-main { display: grid; grid-template-columns: minmax(0, 1.5fr) minmax(310px, .72fr); gap: 14px; margin-bottom: 14px; }
    .grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
    .grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin-bottom: 14px; }
    .panel { padding: 19px; }
    .panel-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 17px; }
    .panel-title { min-width: 0; }
    .panel-title h3 { margin: 0; font-size: 15px; }
    .panel-title p { margin: 4px 0 0; color: var(--muted); font-size: 11px; }
    .link { border: 0; background: none; color: #565f6f; font-size: 11px; font-weight: 800; white-space: nowrap; }
    .section-tabs, .filters { display: flex; gap: 5px; margin-bottom: 15px; padding: 4px; border-radius: 8px; background: #f3f4f6; overflow-x: auto; }
    .section-tabs button, .filters button { flex: 1; min-width: max-content; min-height: 30px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font-size: 10px; font-weight: 800; padding: 0 10px; }
    .section-tabs button.active, .filters button.active { background: #fff; color: var(--ink); box-shadow: 0 1px 4px rgba(0,0,0,.08); }
    .chart { position: relative; height: 174px; display: flex; align-items: end; justify-content: space-between; gap: 11px; padding: 12px 8px 26px; border-bottom: 1px solid var(--line); background-image: linear-gradient(to bottom, transparent 24%, #f0f2f5 25%, transparent 26%, transparent 49%, #f0f2f5 50%, transparent 51%, transparent 74%, #f0f2f5 75%, transparent 76%); }
    .bar-set { height: 100%; flex: 1; display: flex; align-items: end; justify-content: center; gap: 4px; position: relative; }
    .bar { width: min(17px, 40%); border-radius: 4px 4px 0 0; background: #d9dee6; transition: height .3s ease; }
    .bar.in { background: var(--green); }
    .bar.warn { background: var(--orange); }
    .bar.blue { background: var(--blue); }
    .bar-set label { position: absolute; bottom: -20px; color: #858c98; font-size: 9px; white-space: nowrap; }
    .legend, .inline-meta { display: flex; gap: 13px; color: var(--muted); font-size: 10px; flex-wrap: wrap; }
    .legend span::before { content: ""; width: 7px; height: 7px; display: inline-block; margin-right: 5px; border-radius: 2px; background: var(--green); }
    .legend span:nth-child(2)::before { background: #d8dee7; }
    .legend span:nth-child(3)::before { background: var(--orange); }
    .forecast, .notice { margin-top: 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 11px 13px; border-radius: 8px; background: #f6f8fa; font-size: 11px; color: var(--muted); }
    .forecast b, .notice b { color: var(--ink); font-size: 12px; }
    .list { display: grid; gap: 1px; }
    .row { display: grid; grid-template-columns: 38px minmax(0, 1fr) auto; gap: 11px; align-items: center; padding: 12px 0; border-bottom: 1px solid #f0f1f3; }
    .row:last-child { border-bottom: 0; }
    .row-icon { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 9px; font-weight: 900; font-size: 10px; }
    .row-icon.red { color: var(--red); background: var(--red-soft); }
    .row-icon.amber { color: var(--amber); background: var(--amber-soft); }
    .row-icon.blue { color: var(--blue); background: var(--blue-soft); }
    .row-icon.green { color: var(--green); background: var(--green-soft); }
    .row b, .row span { display: block; min-width: 0; }
    .row b { font-size: 12px; overflow-wrap: anywhere; }
    .row span { margin-top: 3px; color: var(--muted); font-size: 10px; }
    .row button { min-height: 28px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; background: #fff; font-size: 10px; font-weight: 800; }
    .status { display: inline-flex; align-items: center; justify-content: center; min-height: 22px; padding: 4px 8px; border-radius: 999px; font-size: 10px; font-weight: 800; white-space: nowrap; }
    .status.ok { color: var(--green); background: var(--green-soft); }
    .status.warn { color: var(--amber); background: var(--amber-soft); }
    .status.bad { color: var(--red); background: var(--red-soft); }
    .status.info { color: var(--blue); background: var(--blue-soft); }
    .table-wrap { width: 100%; overflow-x: auto; }
    table { width: 100%; min-width: 620px; border-collapse: collapse; font-size: 11px; }
    th { color: var(--muted); text-align: left; font-weight: 800; background: #f7f8fa; }
    th, td { padding: 11px 10px; border-bottom: 1px solid #edf0f3; white-space: nowrap; }
    td strong { font-size: 12px; }
    .amount { text-align: right; font-weight: 850; }
    .cards-list { display: grid; gap: 12px; }
    .business-card, .integration-card { display: grid; gap: 11px; padding: 14px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .integration-suite { display: grid; gap: 14px; }
    .integration-service-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
    .integration-service-card { min-height: 178px; display: grid; align-content: space-between; gap: 12px; padding: 15px; border: 1px solid var(--line); border-radius: 10px; background: #fff; }
    .integration-service-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
    .connector-logo { width: 36px; height: 36px; display: grid; place-items: center; border-radius: 9px; color: #fff; background: var(--nav); font-size: 12px; font-weight: 900; }
    .connector-logo.green { background: var(--green); }
    .connector-logo.orange { background: var(--orange); }
    .connector-logo.blue { background: var(--blue); }
    .connector-logo.amber { background: var(--amber); }
    .connector-copy b { display: block; font-size: 13px; }
    .connector-copy span { display: block; margin-top: 4px; color: var(--muted); font-size: 10px; line-height: 1.45; }
    .connector-tags { display: flex; gap: 5px; flex-wrap: wrap; }
    .connector-tags span { padding: 4px 7px; border-radius: 99px; background: #f1f3f6; color: #4b5563; font-size: 9px; font-weight: 800; }
    .integration-action-grid { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 8px; }
    .integration-action { min-height: 78px; display: grid; align-content: center; gap: 5px; padding: 11px; border: 1px solid var(--line); border-radius: 9px; background: #f8f9fb; text-align: left; }
    .integration-action strong { font-size: 12px; }
    .integration-action span { color: var(--muted); font-size: 10px; line-height: 1.45; }
    .integration-progress { display: grid; gap: 9px; }
    .progress-row { display: grid; grid-template-columns: minmax(90px, .55fr) minmax(0, 1fr) auto; gap: 10px; align-items: center; color: var(--muted); font-size: 10px; }
    .progress-track { height: 8px; border-radius: 99px; background: #eef1f5; overflow: hidden; }
    .progress-track span { display: block; height: 100%; border-radius: inherit; background: var(--green); }
    .progress-track.warn span { background: var(--amber); }
    .progress-track.bad span { background: var(--red); }
    .requirement-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; }
    .requirement-card { min-height: 94px; padding: 11px; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
    .requirement-card strong { display: block; font-size: 12px; overflow-wrap: anywhere; }
    .requirement-card span { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; line-height: 1.45; }
    .credential-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
    .credential-grid .wide { grid-column: 1 / -1; }
    .fallback-lane { display: grid; grid-template-columns: minmax(0, .9fr) minmax(0, 1.1fr); gap: 12px; align-items: start; }
    .manual-pipeline { display: grid; gap: 8px; }
    .manual-pipeline .step { padding: 9px; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
    .upload-split { display: grid; grid-template-columns: minmax(0, 1fr) minmax(220px, .52fr); gap: 12px; align-items: stretch; }
    .manual-receipt-list { display: grid; gap: 8px; }
    .manual-receipt-list button { min-height: 44px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; text-align: left; font-size: 11px; font-weight: 800; }
    .flow-grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 8px; margin-bottom: 14px; }
    .flow-step { min-height: 74px; padding: 10px; border: 1px solid var(--line); border-radius: 9px; background: #fff; }
    .flow-step strong { display: block; font-size: 11px; }
    .flow-step span { display: block; margin-top: 5px; color: var(--muted); font-size: 10px; line-height: 1.45; }
    .dropzone { min-height: 130px; display: grid; place-items: center; gap: 8px; padding: 18px; border: 1px dashed #b8c1ce; border-radius: 10px; background: #fbfcfe; text-align: center; color: var(--muted); font-size: 11px; }
    .dropzone b { color: var(--ink); font-size: 13px; }
    .source-badge { display: inline-flex; margin-left: 4px; padding: 2px 6px; border-radius: 99px; background: var(--blue-soft); color: var(--blue); font-size: 9px; font-weight: 850; }
    .mini-form { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; }
    .heatmap { display: grid; grid-template-columns: 54px repeat(7, minmax(30px, 1fr)); gap: 5px; align-items: center; font-size: 10px; color: var(--muted); }
    .heatmap b, .heatmap span { min-height: 28px; display: grid; place-items: center; border-radius: 6px; background: #f4f6f8; }
    .heatmap .h1 { background: #eaf8f2; color: var(--green); }
    .heatmap .h2 { background: #fff2ea; color: var(--orange); }
    .heatmap .h3 { background: #fff0f0; color: var(--red); }
    .toggle-off { display: inline-flex; align-items: center; gap: 7px; color: var(--muted); font-size: 10px; font-weight: 800; }
    .toggle-off::before { content: ""; width: 32px; height: 18px; border-radius: 99px; background: #d1d5db; box-shadow: inset 3px 0 0 #fff; }
    .card-row { display: flex; justify-content: space-between; gap: 12px; align-items: flex-start; }
    .card-row b { display: block; font-size: 13px; }
    .card-row span { display: block; color: var(--muted); font-size: 10px; margin-top: 3px; }
    .summary-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
    .summary-grid div { padding: 10px; border-radius: 8px; background: #f7f8fa; }
    .summary-grid small { display: block; color: var(--muted); font-size: 9px; }
    .summary-grid strong { display: block; margin-top: 4px; font-size: 12px; overflow-wrap: anywhere; }
    .timeline { display: grid; gap: 10px; }
    .step { display: grid; grid-template-columns: 24px minmax(0,1fr) auto; gap: 10px; align-items: center; }
    .step-dot { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; background: var(--green-soft); color: var(--green); font-size: 10px; font-weight: 900; }
    .step b { font-size: 12px; }
    .step span { display: block; margin-top: 2px; color: var(--muted); font-size: 10px; }
    .bottom-nav { display: none; }
    .filter-panel { margin-bottom: 14px; padding: 15px; }
    .filter-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
    .filter-head h3 { margin: 0; font-size: 13px; }
    .filter-head span { color: var(--muted); font-size: 10px; }
    .filter-grid { display: grid; grid-template-columns: repeat(6, minmax(120px, 1fr)); gap: 10px; align-items: end; }
    .field { display: grid; gap: 5px; min-width: 0; }
    .field label { color: #525b69; font-size: 10px; font-weight: 800; }
    .field input, .field select, .auth-card input, .auth-card select {
      width: 100%; min-width: 0; min-height: 38px; padding: 0 10px; border: 1px solid var(--line);
      border-radius: 8px; background: #fff; color: var(--ink); font: inherit; font-size: 11px;
    }
    .filter-actions { display: flex; gap: 7px; align-items: center; }
    .quick-ranges { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 10px; }
    .quick-ranges button { min-height: 28px; padding: 0 9px; border: 1px solid var(--line); border-radius: 6px; background: #fff; color: var(--muted); font-size: 10px; font-weight: 800; }
    button:focus-visible, input:focus-visible, select:focus-visible, [role="button"]:focus-visible { outline: 3px solid rgba(55,120,212,.28); outline-offset: 2px; }
    .overlay { position: fixed; inset: 0; z-index: 80; display: none; justify-content: flex-end; background: rgba(17,24,39,.48); }
    .overlay.open { display: flex; }
    .drawer { width: min(560px, 100%); height: 100%; overflow-y: auto; padding: 24px; background: #fff; box-shadow: -20px 0 55px rgba(17,24,39,.18); }
    .drawer-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 16px; padding-bottom: 16px; border-bottom: 1px solid var(--line); }
    .drawer-head h2 { margin: 0; font-size: 20px; }
    .drawer-head p { margin: 5px 0 0; color: var(--muted); font-size: 11px; }
    .icon-close { width: 36px; height: 36px; border: 1px solid var(--line); border-radius: 8px; background: #fff; font-size: 20px; }
    .drawer-body { display: grid; gap: 14px; padding-top: 16px; }
    .detail-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .detail-block { padding: 13px; border: 1px solid var(--line); border-radius: 9px; background: #f8f9fb; }
    .detail-block small { display: block; color: var(--muted); font-size: 9px; }
    .detail-block strong { display: block; margin-top: 5px; font-size: 12px; overflow-wrap: anywhere; }
    .drawer-actions { display: flex; gap: 8px; justify-content: flex-end; flex-wrap: wrap; padding-top: 4px; }
    .profile { cursor: pointer; border-radius: 8px; }
    .profile:hover { background: #f7f8fa; }
    .profile-menu { display: grid; gap: 8px; }
    .profile-menu button { min-height: 42px; padding: 0 12px; border: 1px solid var(--line); border-radius: 8px; background: #fff; text-align: left; font-weight: 750; }
    .auth-shell { min-height: calc(100vh - 150px); display: grid; place-items: center; padding: 24px 0; }
    .auth-card { width: min(560px, 100%); padding: 28px; }
    .auth-brand { display: flex; align-items: center; gap: 9px; margin-bottom: 22px; font-weight: 900; }
    .auth-card h2 { margin: 0; font-size: 23px; }
    .auth-card > p { margin: 7px 0 20px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .auth-form { display: grid; gap: 12px; }
    .auth-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
    .auth-card .primary { width: 100%; min-height: 44px; margin-top: 4px; }
    .auth-links { display: flex; justify-content: center; gap: 12px; flex-wrap: wrap; margin-top: 16px; }

    @media (max-width: 1180px) {

      .hero { align-items: flex-start; }
      .kpis { grid-template-columns: repeat(2, minmax(0,1fr)); }
      .grid-main, .grid-2 { grid-template-columns: 1fr; }
      .bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; height: 70px; display: flex; overflow-x: auto; background: rgba(255,255,255,.96); border-top: 1px solid var(--line); backdrop-filter: blur(12px); }
      .bottom-nav button { flex: 0 0 68px; border: 0; background: transparent; color: #808897; display: grid; place-items: center; align-content: center; gap: 4px; font-size: 9px; font-weight: 750; }

    @media (max-width: 620px) {

      .grid-3 { grid-template-columns: 1fr; }

      .credential-grid .wide { grid-column: auto; }

      .panel { padding: 16px; }

    }

        "hr-connect": ["노무·4대보험 연동", "직원 계약, 급여, 입퇴사 신고 일정을 연동합니다.", `<div class="detail-grid">${detailCard("대상","급여대장, 4대보험, 입퇴사")}${detailCard("권한","대표·노무 담당 분리")}${detailCard("알림","계약/보건증/보험 신고 마감")}${detailCard("자료","계약서, 급여명세서, 원천세")}</div><button type="button" class="primary" data-action="confirm-state">후보 저장</button>`],
        "pg-connect": ["카드·PG 연동", "KCP, 나이스, 토스페이먼츠 정산과 은행 입금을 대사합니다.", `<div class="detail-grid">${detailCard("수집","승인, 취소, 수수료, 정산 예정")}${detailCard("대사","은행 입금 자동 매칭")}${detailCard("예외","차이 금액, 보류, 취소 누락")}${detailCard("보고","정산 차이 리포트")}</div><button type="button" class="primary" data-action="confirm-state">후보 저장</button>`],
        connect: ["외부 서비스 연동", "판매사이트, 은행, 매입처, 홈택스, POS/PG를 추가합니다.", `<div class="profile-menu"><button type="button" data-action="sales-channel-connect">판매사이트: 배민·쿠팡이츠·요기요·땡겨요</button><button type="button" data-action="bank-connect">은행: 신한은행 기업·기업은행 기업</button><button type="button" data-action="supplier-connect">매입처: 쿠팡·마켓봄·뉴통·발주고·직접 추가</button><button type="button" data-action="tax-connect">홈택스·전자세금계산서</button><button type="button" data-action="receipt-upload">주문 프로그램 없는 매입처 증빙 등록</button><button type="button" data-action="recommended-connectors">추가 권장 연동 후보</button></div>`],
        calendar: ["세무 캘린더", "신고·납부 일정 상세", `<div class="timeline">${step("!","부가가치세","2026-07-25 · D-2","대기")}${step("2","원천세","2026-08-10","검토")}${step("3","법인세 중간예납","2026-08-31","예정")}</div>`],
        primary: ["주요 작업", `${views[slug] ? views[slug].title : "현재 화면"} 업무`, `<div class="profile-menu"><button type="button" data-action="review">상세현황 검토</button><button type="button" data-action="download">자료 미리보기·내보내기</button><button type="button" data-action="help">검토 메모 남기기</button></div>`]
      };
      if (action === "review" && reviewByView[slug]) {
        const item = reviewByView[slug];
        return [item[0], item[1], `<div class="detail-grid">${item[2].map((pair) => detailCard(pair[0], pair[1])).join("")}</div><div class="drawer-actions"><button type="button" class="outline" data-action="download">근거자료</button><button type="button" class="primary" data-action="confirm-state">검토 완료</button></div>`];
      }
      return specs[action] || ["상세현황", "선택한 업무의 상세 화면입니다.", `<div class="notice"><span>해당 기능의 업무 흐름을 확인하는 UX 시안입니다.</span><b>시안 데이터</b></div>`];
    }
    function openDetail(action) {
      const [title, subtitle, body] = detailContent(action);
      drawerTitle.textContent = title;
      drawerSubtitle.textContent = subtitle;
      drawerBody.innerHTML = body;
      detailOverlay.classList.add("open");
      detailOverlay.setAttribute("aria-hidden", "false");
      document.body.style.overflow = "hidden";
      detailOverlay.querySelector("[data-close-overlay]").focus();
    }
    function closeDetail() {
      detailOverlay.classList.remove("open");
      detailOverlay.setAttribute("aria-hidden", "true");
      document.body.style.overflow = "";
    }

    const actionMessages = {
      "business-switch": "전역 사업자 전환 패널을 여는 시안 동작입니다.",
      "mobile-menu": "모바일 하단 메뉴에서 전체 화면을 전환할 수 있습니다.",
      search: "사업자·직원·거래 통합 검색을 여는 시안 동작입니다.",
      notification: "미처리 알림 5건을 확인합니다.",
      report: "월간 CEO 보고서를 PDF·엑셀로 생성합니다.",
      connect: "배달 플랫폼·은행·카드·세무 연동 추가 흐름입니다.",
      task: "업무 상세 확인 패널을 여는 시안 동작입니다.",
      approve: "승인 흐름을 진행하는 시안 동작입니다.",
      match: "입금 자동 매칭 후보를 적용합니다.",
      contract: "근로계약 갱신 문서 작성을 시작합니다.",
      review: "차이 검증 상세 패널을 여는 시안 동작입니다.",
      filter: "현재 필터 조건을 적용했습니다.",
      sync: "외부 연동 데이터를 다시 동기화합니다.",
      download: "보고서 다운로드 CTA 시안 동작입니다.",
      bulk: "선택된 항목을 일괄 처리합니다.",
      reconnect: "인증 갱신 및 재연결 플로우를 시작합니다.",
      "new-business": "신규 사업자 등록 CTA 시안 동작입니다.",
      primary: "현재 화면의 주요 작업 CTA 시안 동작입니다.",
      help: "CEO 검토 메모를 남기는 시안 동작입니다.",
      calendar: "세무 일정 캘린더를 여는 시안 동작입니다.",
      period: "선택한 기간의 시안 데이터를 표시합니다.",
      "export-csv": "현재 표의 CSV 내보내기 요청 상태로 변경했습니다.",
      "export-excel": "현재 표의 Excel 내보내기 요청 상태로 변경했습니다.",
      "comparison-toggle": "비교기간 표시를 켠 시안 상태입니다.",
      "sales-tab": "매출 통계/상세 탭을 전환했습니다.",
      "sales-channel-connect": "판매사이트 연동 설정을 여는 시안 동작입니다.",
      "bank-connect": "은행 빠른계좌조회 설정을 여는 시안 동작입니다.",
      "supplier-connect": "매입처·발주 프로그램 설정을 여는 시안 동작입니다.",
      "tax-connect": "홈택스·계산서 연동 설정을 여는 시안 동작입니다.",
      "receipt-upload": "수기 증빙 사진 등록 화면을 여는 시안 동작입니다.",
      "integration-audit": "연동 권한과 보안 점검 패널을 여는 시안 동작입니다.",
      "integration-guide": "연동 설정 가이드를 여는 시안 동작입니다.",
      "recommended-connectors": "추가 권장 연동 후보를 여는 시안 동작입니다.",
      "credential-vault": "연동 인증정보 보관 정책을 여는 시안 동작입니다.",
      "pos-connect": "POS·키오스크 연동 후보 상세를 여는 시안 동작입니다.",
      "review-connect": "리뷰·CS 연동 후보 상세를 여는 시안 동작입니다.",
      "hr-connect": "노무·4대보험 연동 후보 상세를 여는 시안 동작입니다.",
      "pg-connect": "카드·PG 연동 후보 상세를 여는 시안 동작입니다."
    };

    const normalizeHash = () => {
      const slug = window.location.hash.replace("#", "");
      return views[slug] ? slug : "home";
    };
    const render = (slug, updateHash = true) => {
      const view = views[slug] || views.home;
      closeDetail();
      pageTitle.textContent = view.title;
      document.title = `매장비서 · ${view.title} 시안`;
      viewRoot.innerHTML = view.html();
      window.scrollTo(0, 0);
      document.querySelectorAll("[data-view]").forEach((item) => item.classList.toggle("active", item.dataset.view === slug));
      if (updateHash && window.location.hash !== `#${slug}`) {
        history.pushState(null, "", `#${slug}`);
      }
    };

    document.addEventListener("click", (event) => {
      const authButton = event.target.closest("[data-auth]");
      if (authButton) {
        render(authButton.dataset.auth);
        return;
      }
      const viewButton = event.target.closest("[data-view]");
      if (viewButton) {
        const slug = viewButton.dataset.view;
        render(slug);
        showToast(`${views[slug].title} 화면으로 전환했습니다.`);
        return;
      }
      const actionButton = event.target.closest("[data-action]");
      if (actionButton) {
        const action = actionButton.dataset.action;
        if (action === "new-business") {
          render("auth-onboarding");
          return;
        }
        if (action === "logout") {
          render("auth-login");
          showToast("로그아웃 후 로그인 화면으로 이동한 시안입니다.");
          return;
        }
        if (action === "confirm-state") {
          closeDetail();
          showToast("선택한 상태 변경을 시안에 반영했습니다.");
          return;
        }
        const detailActions = new Set(["profile","search","notification","report","task","approve","match","contract","review","download","business-switch","connect","calendar","primary","sales-detail","account-detail","employee-detail","business-detail","employee-docs","contract-builder","signature-progress","business-ocr","menu-detail","order-detail","approval-detail","margin-detail","audit-detail","document-vault","sales-channel-connect","bank-connect","supplier-connect","tax-connect","receipt-upload","integration-audit","integration-guide","recommended-connectors","credential-vault","pos-connect","review-connect","hr-connect","pg-connect"]);
        if (detailActions.has(action)) {
          openDetail(action);
          return;
        }
        showToast(actionMessages[action] || "시안 동작입니다.");
      }
    });
    document.addEventListener("submit", (event) => {
      if (event.target.matches("[data-filter-form]")) {
        event.preventDefault();
        const values = [...new FormData(event.target).values()].filter(Boolean);
        showToast(`${values.length}개 검색 조건을 적용했습니다.`);
      }
      if (event.target.matches("[data-auth-form]")) {
        event.preventDefault();
        const nextView = event.target.dataset.nextView;
        if (nextView) {
          render(nextView);
          showToast("입력 내용을 확인하고 다음 화면으로 이동했습니다.");
        } else {
          showToast("입력 내용을 확인했습니다.");
        }
      }
      if (event.target.matches("[data-search-form], [data-report-form]")) {
        event.preventDefault();
        closeDetail();
        showToast("요청을 접수한 시안 상태로 변경했습니다.");
      }
    });
    document.addEventListener("reset", (event) => {
      if (event.target.matches("[data-filter-form]")) {
        window.setTimeout(() => showToast("검색 조건을 초기화했습니다."), 0);
      }
    });
    document.addEventListener("change", (event) => {
      if (event.target.matches("select[data-action]")) {
        showToast(`${event.target.value} 기준의 시안 데이터를 표시합니다.`);
      }
    });
    document.addEventListener("click", (event) => {
      const tab = event.target.closest(".section-tabs button, .filters button");
      if (!tab) return;
      tab.parentElement.querySelectorAll("button").forEach((item) => item.classList.remove("active"));
      tab.classList.add("active");
      showToast(`${tab.textContent} 필터를 적용했습니다.`);
    });
    document.addEventListener("click", (event) => {
      const rangeButton = event.target.closest("[data-range]");
      if (!rangeButton) return;
      rangeButton.parentElement.querySelectorAll("button").forEach((item) => item.classList.remove("active"));
      rangeButton.classList.add("active");
      showToast(`${rangeButton.textContent} 기간을 적용했습니다.`);
    });
    document.addEventListener("click", (event) => {
      if (event.target.closest("[data-close-overlay]")) closeDetail();
      if (event.target === detailOverlay) closeDetail();
    });
    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && detailOverlay.classList.contains("open")) closeDetail();
      if ((event.key === "Enter" || event.key === " ") && event.target.matches(".profile[role='button']")) {
        event.preventDefault();
        openDetail("profile");
      }
    });
    window.addEventListener("hashchange", () => render(normalizeHash(), false));
    render(normalizeHash(), false);
  </script>
</body>
</html>
