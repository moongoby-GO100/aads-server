# fb.newtalk.kr -> ACCT/OBYS app on cafe24_114 (apache2).
# Installed by scripts/cutover_fb_cafe24.sh as
#   /etc/apache2/sites-available/00-zz-fb.newtalk.kr.conf  (+ sites-enabled symlink)
# The file name is load-bearing (LC_ALL=C order): apache matches name vhosts in sites-enabled
# filename order. It must sort AFTER 00-pick*/00-v2* (the first vhost of a port is that port's
# default server, so 00-fb would hijack :443 raw-IP / unknown-SNI traffic) and BEFORE
# 000-default.conf / default-ssl.conf, which carry a *.newtalk.kr wild alias that would otherwise win:
#   00-v2 < 00-zz-fb < 000-default < default-ssl
# __FB_UPSTREAM__ is replaced at install time with http://<acct-pg bridge IP>:8111.
# The app containers share acct-pg's network namespace and publish no host port,
# so the bridge IP is the only route; the script re-resolves and re-verifies it.
# Both vhosts carry identical route blocks (BEGIN-ROUTES..END-ROUTES);
# `cutover_fb_cafe24.sh lint` fails if they drift.
# Mirrors the live contabo116 fb.conf except /unni-naengmyeon/ and /_next/
# (AADS dashboard) which do not exist on this host.

<VirtualHost *:80>
    ServerName fb.newtalk.kr
    ErrorLog ${APACHE_LOG_DIR}/fb.newtalk.kr-error.log
    CustomLog ${APACHE_LOG_DIR}/fb.newtalk.kr-access.log combined
    RequestHeader set X-Forwarded-Proto "http"

    # BEGIN-ROUTES
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Real-IP expr=%{REMOTE_ADDR}
    AddOutputFilterByType DEFLATE application/json text/css application/javascript

    RewriteEngine On
    RewriteRule ^/$ /static/apps/obys/index.html?v=20260722.2135 [R=302,L]
    RewriteRule ^/login$ /static/apps/obys/index.html [R=302,L]
    RewriteRule ^/static/apps/yeoljeong-finance/index\.html$ /static/apps/obys/index.html [R=301,L]

    ProxyPassMatch "^/(login)?$" !
    ProxyPassMatch "^/static/apps/yeoljeong-finance/index\.html$" !
    ProxyPass "/api/v1/" "__FB_UPSTREAM__/api/v1/" connectiontimeout=3 timeout=600 retry=0 keepalive=On
    ProxyPassReverse "/api/v1/" "__FB_UPSTREAM__/api/v1/"
    ProxyPass "/" "__FB_UPSTREAM__/" connectiontimeout=3 timeout=300 retry=0
    ProxyPassReverse "/" "__FB_UPSTREAM__/"

    <Location "/api/v1/">
        LimitRequestBody 20971520
        SetEnv no-gzip 1
        Header always set Cache-Control "no-store, no-cache, must-revalidate"
    </Location>
    <Location "/health/live">
        Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
    </Location>
    <Location "/static/">
        Header always setifempty Cache-Control "public, max-age=3600"
    </Location>
    <LocationMatch "^/static/apps/[^/]+/index\.html$">
        Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
    </LocationMatch>
    <LocationMatch "^/(login)?$">
        Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
    </LocationMatch>
    # END-ROUTES
</VirtualHost>

<VirtualHost *:443>
    ServerName fb.newtalk.kr
    ErrorLog ${APACHE_LOG_DIR}/fb.newtalk.kr-error.log
    CustomLog ${APACHE_LOG_DIR}/fb.newtalk.kr-access.log combined
    RequestHeader set X-Forwarded-Proto "https"

    SSLEngine on
    SSLProtocol -all +TLSv1.2 +TLSv1.3
    SSLCertificateFile /etc/ssl_newtalk_le/ssl.crt
    SSLCertificateKeyFile /etc/ssl_newtalk_le/ssl.key

    # BEGIN-ROUTES
    ProxyRequests Off
    ProxyPreserveHost On
    RequestHeader set X-Real-IP expr=%{REMOTE_ADDR}
    AddOutputFilterByType DEFLATE application/json text/css application/javascript

    RewriteEngine On
    RewriteRule ^/$ /static/apps/obys/index.html?v=20260722.2135 [R=302,L]
    RewriteRule ^/login$ /static/apps/obys/index.html [R=302,L]
    RewriteRule ^/static/apps/yeoljeong-finance/index\.html$ /static/apps/obys/index.html [R=301,L]

    ProxyPassMatch "^/(login)?$" !
    ProxyPassMatch "^/static/apps/yeoljeong-finance/index\.html$" !
    ProxyPass "/api/v1/" "__FB_UPSTREAM__/api/v1/" connectiontimeout=3 timeout=600 retry=0 keepalive=On
    ProxyPassReverse "/api/v1/" "__FB_UPSTREAM__/api/v1/"
    ProxyPass "/" "__FB_UPSTREAM__/" connectiontimeout=3 timeout=300 retry=0
    ProxyPassReverse "/" "__FB_UPSTREAM__/"

    <Location "/api/v1/">
        LimitRequestBody 20971520
        SetEnv no-gzip 1
        Header always set Cache-Control "no-store, no-cache, must-revalidate"
    </Location>
    <Location "/health/live">
        Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
    </Location>
    <Location "/static/">
        Header always setifempty Cache-Control "public, max-age=3600"
    </Location>
    <LocationMatch "^/static/apps/[^/]+/index\.html$">
        Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
    </LocationMatch>
    <LocationMatch "^/(login)?$">
        Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"
    </LocationMatch>
    # END-ROUTES
</VirtualHost>
