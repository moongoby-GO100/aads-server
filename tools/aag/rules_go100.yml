# ── 규칙 심각도 ─────────────────────────────────────────────────────────
severity:
  DUP_MODULE: P1
  DOUBLE_MOUNT: P1
  ROUTE_SHADOWED: P0
  ORPHAN_ROUTER: P2
  TABLE_NO_MODEL: P1
  PATH_DRIFT: P1
  ROUTE_MISSING: P0
  STALE_BACKUP: P2

# ── 출력 ────────────────────────────────────────────────────────────────
output:
  graph_json: reports/aag/go100-graph.json
  mermaid: reports/aag/go100-arch.mmd
  findings_md: reports/aag/go100-findings.md
  mermaid_max_namespaces: 40
