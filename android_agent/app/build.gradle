plugins {
    id "com.android.application"
}

android {
    namespace "kr.newtalk.aads.agent"
    compileSdk 35

    defaultConfig {
        applicationId "kr.newtalk.aads.agent"
        minSdk 26
        targetSdk 35
        versionCode 2
        versionName "0.1.1"
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation "com.squareup.okhttp3:okhttp:4.12.0"
}
