# gitleaks 설정 — 기본 룰셋을 그대로 쓰고, 공개 모델 식별자 오탐만 좁게 뺀다.
#
# 2026-09-29 runner-7d3e75f0 이 7파일을 수정하고도 approval_commit_failed 로 폐기됐다.
# 시크릿으로 잡힌 값은 `"model_key": "claude-haiku-4-5-20251001"` — CLAUDE.md 에도
# 적힌 공개 모델 id 였고, generic-api-key 가 "key" 가 든 변수명 + 엔트로피 3.7 로 걸렀다.
# 오류 사전 git.gitleaks_blocks_masking_test_fixture 재발 22회째.
#
# 규칙
#   - useDefault = true 를 지우지 마라. 기본 룰을 끄면 보안 게이트가 사라진다.
#   - allowlist 는 generic-api-key 한 룰에만, 그리고 "값 전체가 모델 id 모양" 일 때만 건다.
#     파일·디렉터리·tests/ 통째 제외 금지. sk-ant-… / sk-proj-… / AIzaSy… / ghp_… / AKIA…
#     같은 실제 키 형식은 전용 룰이 잡으므로 계속 차단된다.
#   - 회귀시험: tests/unit/test_gitleaks_model_id_allowlist.py

title = "AADS gitleaks config"

[extend]
useDefault = true

[[allowlists]]
description = "공개 LLM 모델 식별자 (claude-/gpt-/gemini-/deepseek-) — 시크릿이 아님"
condition = "OR"
targetRules = ["generic-api-key"]
regexTarget = "secret"
# 값 전체가 소문자 모델 id 여야 한다: 선택적 LiteLLM 공급자 접두 + 계열명 + '-' 로 이어진
# 짧은 토큰(각 12자 이하, 최대 8개). 대문자·긴 난수열은 통과하지 못한다.
regexes = [
  '''^(?:(?:anthropic|openai|gemini|deepseek)/)?(?:claude|gpt|gemini|deepseek)-[a-z0-9]{1,12}(?:[.-][a-z0-9]{1,12}){0,7}$''',
]
