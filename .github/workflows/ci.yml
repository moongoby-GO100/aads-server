name: AADS CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Unit Tests + Tool Integrity
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      ANTHROPIC_AUTH_TOKEN: dummy_oauth_token_for_ci
      OPENAI_API_KEY: dummy_openai_key_for_ci
      GOOGLE_API_KEY: dummy_google_key_for_ci
      E2B_API_KEY: PLACEHOLDER_E2B_API_KEY
      JWT_SECRET_KEY: synthetic_ci_only_secret_at_least_32_chars
      SUPABASE_DIRECT_URL: postgresql://postgres:dummy@localhost:5432/aads
      UPSTASH_REDIS_URL: ""

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Tool consistency check (no --fix)
        run: |
          python scripts/check_tool_consistency.py
        continue-on-error: false

      - name: Chat modernization WP00 regression gate
        run: |
          pytest \
            tests/unit/test_chat_modernization_wp00.py \
            tests/unit/test_chat_retry_partial_lifecycle.py \
            tests/unit/test_chat_resume_owner_fence_v2.py \
            tests/unit/test_chat_status_retry_projection.py \
            -q --tb=short --timeout=60
        continue-on-error: false

      - name: Run unit tests
        run: |
          pytest tests/unit/ -v --tb=short --timeout=60
        continue-on-error: false

      - name: Run E2E pipeline tests (optional)
        run: |
          pytest tests/e2e/test_real_pipeline.py -v --tb=short --timeout=30
        continue-on-error: true

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install ruff
      - name: Ruff critical checks (undefined names)
        run: ruff check app/ --select F821,F811 --no-fix
        continue-on-error: false
      - name: Ruff full (advisory)
        run: ruff check app/ tests/ --ignore E501,F401
        continue-on-error: true

  mockup-gate:
    # 오프라인 목업 선언 검사(서버 규칙 classify 만 실행). CI 는 서버에 접속하지 않으므로 승인 여부는 판정하지 않는다.
    # 기본은 경고(shadow). enforce 로 올리는 절차: docs/plans/20261014_AADS_목업_실행게이트_enforce_전환_절차.md
    name: Mockup declaration check (offline, advisory)
    runs-on: ubuntu-latest
    env:
      MOCKUP_GATE_MODE: shadow
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Classify changed files and commit messages
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            range="origin/${{ github.base_ref }}...HEAD"
          elif [ -n "${{ github.event.before }}" ] && git cat-file -e "${{ github.event.before }}^{commit}" 2>/dev/null; then
            range="${{ github.event.before }}..${{ github.sha }}"
          else
            range="HEAD~1..HEAD"
          fi
          git diff --name-only "$range" > "$RUNNER_TEMP/changed_files.txt"
          git log --format=%B "$range" > "$RUNNER_TEMP/messages.txt"
          rc=0
          out=$(python3 scripts/verify_mockup_approval.py --offline \
            --changed-files "$RUNNER_TEMP/changed_files.txt" \
            --instruction-file "$RUNNER_TEMP/messages.txt") || rc=$?
          echo "$out"
          if [ "$rc" -ne 0 ] || echo "$out" | grep -q 'mockup_bundle_required'; then
            echo "::warning title=mockup gate (offline)::UI 변경인데 승인 번들 선언이 없거나 형식이 틀립니다. 승인 여부는 서버 게이트만 판정합니다. $out"
          fi
          exit $rc
        continue-on-error: true
