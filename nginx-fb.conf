# Yeoljeong Gukbap finance app.
# Applied as /etc/nginx/conf.d/fb.conf, separate from AADS so
# https://aads.newtalk.kr never falls through to this default SSL server.

server {
    listen 80;
    server_name fb.newtalk.kr;

    gzip on;
    gzip_types application/json text/css application/javascript;
    gzip_min_length 1000;

    location = / {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        return 302 /static/apps/yeoljeong-finance/index.html?v=20260722.2135;
    }

    location = /health/live {
        proxy_pass http://yeoljeong_finance_api/health/live;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location /api/v1/ {
        # The finance app accepts onboarding documents up to 15 MiB.
        # Keep proxy headroom for multipart boundaries and form fields.
        client_max_body_size 20m;
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://yeoljeong_finance_api/api/v1/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_connect_timeout 3s;
        proxy_next_upstream error timeout http_502 http_503;
        proxy_next_upstream_timeout 5s;
        proxy_next_upstream_tries 2;
        proxy_buffering off;
        gzip off;
        proxy_cache off;
        proxy_http_version 1.1;
        proxy_set_header Connection '';
        keepalive_timeout 600;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location /unni-naengmyeon/ {
        proxy_pass http://aads_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    location = /login {
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
        return 302 /static/apps/yeoljeong-finance/index.html$is_args$args;
    }

    location /_next/ {
        proxy_pass http://aads_dashboard;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
    }

    location = /static/apps/yeoljeong-finance/index.html {
        proxy_pass http://yeoljeong_finance_api/static/apps/yeoljeong-finance/index.html;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache off;
        expires off;
        add_header Cache-Control "no-store, no-cache, must-revalidate, max-age=0" always;
    }

    location /static/ {
        proxy_pass http://yeoljeong_finance_api/static/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        expires 1h;
    }

    location / {
        return 302 /static/apps/yeoljeong-finance/index.html?v=20260722.2135;
    }
}

server {
    listen 443 ssl;
    server_name fb.newtalk.kr;

    ssl_certificate /etc/letsencrypt/live/newtalk.kr/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/newtalk.kr/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

