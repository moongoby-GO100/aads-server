version: '3.9'

# AADS Production Docker Compose — T-032
# CEO 승인: 옵션 A (68서버 유지, 도메인 aads.newtalk.kr 고정)

services:
  aads-postgres:
    image: pgvector/pgvector:pg15
    container_name: aads-postgres
    restart: always
    shm_size: 256m
    ports:
      - "5433:5432"
    environment:
      - POSTGRES_USER=aads
      - POSTGRES_PASSWORD=aads2026secure
      - POSTGRES_DB=aads
      - TZ=Asia/Seoul
    command: >
      postgres
      -c shared_buffers=256MB
      -c max_connections=200
    volumes:
      - aads_postgres_data:/var/lib/postgresql/data
      - ./scripts/init_memory_schema.sql:/docker-entrypoint-initdb.d/init_memory_schema.sql:ro
    networks:
      - aads_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aads -d aads"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: aads-redis
    restart: always
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru --appendonly yes --appendfsync everysec
    environment:
      - TZ=Asia/Seoul
    volumes:
      - aads_redis_data:/data
    networks:
      - aads_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ★ Docker Socket Proxy — R-SEC-01: 호스트 root 탈취 방지
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    container_name: aads-socket-proxy
    restart: always
    environment:
      - CONTAINERS=1
      - EXEC=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=0
      - VOLUMES=0
      - SWARM=0
      - SECRETS=0
      - POST=1
      - TZ=Asia/Seoul
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - aads_network
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  aads-server:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aads-server
    restart: always
    stop_grace_period: 30s
    ports:
      # Host-only API port. Public traffic must enter through nginx :443.
      - "127.0.0.1:8100:8080"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://aads:aads2026secure@aads-postgres:5432/aads
      - TZ=Asia/Seoul
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - DOCKER_HOST=tcp://aads-socket-proxy:2375
      - AADS_CONTAINER_NAME=aads-server
      - AADS_PUBLIC_PORT=8100
      - VAULT_ENCRYPTION_KEY=${VAULT_ENCRYPTION_KEY:-}
      - AADS_ACTIVE_CONTAINER_FILE=/app/.active_container
      - AADS_ACTIVE_PORT_FILE=/app/.active_port
      - AADS_BROWSER_BRIDGE_STATE_DIR=/app/browser-bridge-state
      - AADS_MEDIA_STATIC_DIR=/app/generated-media-static
      - PC_AGENT_DEFAULT_AGENT_ID=${PC_AGENT_DEFAULT_AGENT_ID:-2e9379a1-fed}
      - PC_AGENT_DEFAULT_HOSTNAME=${PC_AGENT_DEFAULT_HOSTNAME:-oby-ceo}
    volumes:
      # ★ 소스 볼륨 마운트: 호스트 수정 → 컨테이너 즉시 반영
      - /root/aads/aads-server/app:/app/app:rw
      - aads_generated_media:/app/generated-media-static:rw
      - /root/aads/aads-server/app/.vault.key:/app/app/.vault.key:ro
      - /root/aads/aads-server/.active_container:/app/.active_container:ro
      - /root/aads/aads-server/.active_port:/app/.active_port:ro
      - /root/aads/aads-server/docs:/app/docs:rw
      - /root/aads/aads-server/mcp_servers:/app/mcp_servers:rw
      - /root/aads/aads-server/migrations:/app/migrations:rw
      - /root/aads/aads-server/pc_agent:/app/pc_agent:rw
      - /root/aads/aads-server/scripts:/app/scripts:rw
      - /root/aads/aads-server/browser-bridge-state:/app/browser-bridge-state:rw
      - /root/aads/aads-server/supervisord.conf:/app/supervisord.conf:ro
      - /root/aads/aads-docs/docs:/root/aads/aads-docs/docs:ro
      - /root/aads/aads-docs/reports:/root/aads/aads-docs/reports:ro
      - /root/aads/aads-dashboard/docs:/root/aads/aads-dashboard/docs:ro
      - /root/aads/aads-dashboard/reports:/root/aads/aads-dashboard/reports:ro
      - /root/aads/aads-dashboard/public/reports:/root/aads/aads-dashboard/public/reports:ro
      - /root/aads/aads-dashboard/public/exports:/root/aads/aads-dashboard/public/exports:ro
      - /root/aads/aads-core/docs:/root/aads/aads-core/docs:ro
      - /root/aads/aads-core/reports:/root/aads/aads-core/reports:ro
      - /root/.ssh:/root/.ssh:rw
      - /root/.claude:/root/.claude:rw
      - /root/.genspark/directives:/root/.genspark/directives:ro
      - /root/project-docs:/root/project-docs:ro
      - /root/aads/aads-docs/reports/ceo-documents:/root/aads/aads-docs/reports/ceo-documents:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aads_network
    depends_on:
      aads-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # ★ Blue-Green: green 인스턴스 (profiles로 수동 시작만 가능)
  aads-server-green:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aads-server-green
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      # Host-only API port. Public traffic must enter through nginx :443.
      - "127.0.0.1:8102:8080"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - DATABASE_URL=postgresql://aads:aads2026secure@aads-postgres:5432/aads
      - TZ=Asia/Seoul
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - BRAVE_API_KEY=${BRAVE_API_KEY}
      - DOCKER_HOST=tcp://aads-socket-proxy:2375
      - AADS_CONTAINER_NAME=aads-server-green
      - AADS_PUBLIC_PORT=8102
      - VAULT_ENCRYPTION_KEY=${VAULT_ENCRYPTION_KEY:-}
      - AADS_ACTIVE_CONTAINER_FILE=/app/.active_container
      - AADS_ACTIVE_PORT_FILE=/app/.active_port
      - AADS_BROWSER_BRIDGE_STATE_DIR=/app/browser-bridge-state
      - AADS_MEDIA_STATIC_DIR=/app/generated-media-static
      - PC_AGENT_DEFAULT_AGENT_ID=${PC_AGENT_DEFAULT_AGENT_ID:-2e9379a1-fed}
      - PC_AGENT_DEFAULT_HOSTNAME=${PC_AGENT_DEFAULT_HOSTNAME:-oby-ceo}
    volumes:
      - /root/aads/aads-server/app:/app/app:rw
      - aads_generated_media:/app/generated-media-static:rw
      - /root/aads/aads-server/app/.vault.key:/app/app/.vault.key:ro
      - /root/aads/aads-server/.active_container:/app/.active_container:ro
      - /root/aads/aads-server/.active_port:/app/.active_port:ro
      - /root/aads/aads-server/docs:/app/docs:rw
      - /root/aads/aads-server/mcp_servers:/app/mcp_servers:rw
      - /root/aads/aads-server/migrations:/app/migrations:rw
      - /root/aads/aads-server/pc_agent:/app/pc_agent:rw
      - /root/aads/aads-server/scripts:/app/scripts:rw
      - /root/aads/aads-server/browser-bridge-state:/app/browser-bridge-state:rw
      - /root/aads/aads-server/supervisord.conf:/app/supervisord.conf:ro
      - /root/aads/aads-docs/docs:/root/aads/aads-docs/docs:ro
      - /root/aads/aads-docs/reports:/root/aads/aads-docs/reports:ro
      - /root/aads/aads-dashboard/docs:/root/aads/aads-dashboard/docs:ro
      - /root/aads/aads-dashboard/reports:/root/aads/aads-dashboard/reports:ro
      - /root/aads/aads-dashboard/public/reports:/root/aads/aads-dashboard/public/reports:ro
      - /root/aads/aads-dashboard/public/exports:/root/aads/aads-dashboard/public/exports:ro
      - /root/aads/aads-core/docs:/root/aads/aads-core/docs:ro
      - /root/aads/aads-core/reports:/root/aads/aads-core/reports:ro
      - /root/.ssh:/root/.ssh:rw
      - /root/.claude:/root/.claude:rw
      - /root/.genspark/directives:/root/.genspark/directives:ro
      - /root/project-docs:/root/project-docs:ro
      - /root/aads/aads-docs/reports/ceo-documents:/root/aads/aads-docs/reports/ceo-documents:rw
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aads_network
    depends_on:
      aads-postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      docker-socket-proxy:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s
    profiles:
      - green
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  yeoljeong-finance:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yeoljeong-finance
    restart: always
    stop_grace_period: 30s
    ports:
      - "127.0.0.1:8110:8080"
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - AADS_SERVICE_ROLE=yeoljeong-finance
      - DATABASE_URL=${YEOLJEONG_FINANCE_DATABASE_URL:-postgresql://aads:aads2026secure@aads-postgres:5432/aads}
      - YEOLJEONG_FINANCE_DATABASE_URL=${YEOLJEONG_FINANCE_DATABASE_URL:-postgresql://aads:aads2026secure@aads-postgres:5432/aads}
      - YEOLJEONG_FINANCE_DATA_DIR=/app/yeoljeong-data
      - TZ=Asia/Seoul
      - VAULT_ENCRYPTION_KEY=${VAULT_ENCRYPTION_KEY:-}
      - AADS_BROWSER_BRIDGE_STATE_DIR=/app/browser-bridge-state
    volumes:
      - /root/aads/aads-server/app:/app/app:rw
      - /root/aads/aads-server/app/.vault.key:/app/app/.vault.key:ro
      - /root/aads/aads-server/app/data/yeoljeong_finance:/app/yeoljeong-data:rw
      - /root/aads/aads-server/migrations:/app/migrations:rw
      - /root/aads/aads-server/scripts:/app/scripts:rw
      - /root/aads/aads-server/browser-bridge-state:/app/browser-bridge-state:rw
    command: ["uvicorn", "app.yeoljeong_main:app", "--host", "0.0.0.0", "--port", "8080"]
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aads_network
    depends_on:
      aads-postgres:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health/live"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  yeoljeong-finance-worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yeoljeong-finance-worker
    restart: on-failure
    stop_grace_period: 30s
    env_file:
      - .env
    environment:
      - ENVIRONMENT=production
      - LOG_LEVEL=INFO
      - AADS_SERVICE_ROLE=yeoljeong-finance-worker
      - DATABASE_URL=${YEOLJEONG_FINANCE_DATABASE_URL:-postgresql://aads:aads2026secure@aads-postgres:5432/aads}
      - YEOLJEONG_FINANCE_DATABASE_URL=${YEOLJEONG_FINANCE_DATABASE_URL:-postgresql://aads:aads2026secure@aads-postgres:5432/aads}
      - YEOLJEONG_FINANCE_DATA_DIR=/app/yeoljeong-data
      - TZ=Asia/Seoul
      - VAULT_ENCRYPTION_KEY=${VAULT_ENCRYPTION_KEY:-}
      - AADS_BROWSER_BRIDGE_STATE_DIR=/app/browser-bridge-state
      - YEOLJEONG_AUTO_COLLECT_INTERVAL_SECONDS=${YEOLJEONG_AUTO_COLLECT_INTERVAL_SECONDS:-1800}
      - YEOLJEONG_AUTO_COLLECT_TIMEOUT_SECONDS=${YEOLJEONG_AUTO_COLLECT_TIMEOUT_SECONDS:-300}
      - YEOLJEONG_AUTO_COLLECT_MAX_ATTEMPTS=${YEOLJEONG_AUTO_COLLECT_MAX_ATTEMPTS:-3}
      - YEOLJEONG_AUTO_COLLECT_RETRY_SECONDS=${YEOLJEONG_AUTO_COLLECT_RETRY_SECONDS:-60}
      - YEOLJEONG_AUTO_COLLECT_BLOCKED_RETRY_SECONDS=${YEOLJEONG_AUTO_COLLECT_BLOCKED_RETRY_SECONDS:-180}
      - YEOLJEONG_DELIVERY_PC_AGENT_ID=${YEOLJEONG_DELIVERY_PC_AGENT_ID:-2e9379a1-fed}
    volumes:
      - /root/aads/aads-server/app:/app/app:rw
      - /root/aads/aads-server/app/.vault.key:/app/app/.vault.key:ro
      - /root/aads/aads-server/app/data/yeoljeong_finance:/app/yeoljeong-data:rw
      - /root/aads/aads-server/migrations:/app/migrations:rw
      - /root/aads/aads-server/scripts:/app/scripts:rw
      - /root/aads/aads-server/browser-bridge-state:/app/browser-bridge-state:rw
      - /root/aads/aads-server/.active_port:/app/.active_port:ro
      - /root/aads/aads-server/.active_container:/app/.active_container:ro
    command:
      - /bin/sh
      - -c
      - |
        python scripts/yeoljeong_auto_collect.py --business-id all --branch 전체 --until-complete --exit-zero-on-blocked --max-attempts "$${YEOLJEONG_AUTO_COLLECT_MAX_ATTEMPTS:-3}" --retry-seconds "$${YEOLJEONG_AUTO_COLLECT_RETRY_SECONDS:-60}" --blocked-retry-seconds "$${YEOLJEONG_AUTO_COLLECT_BLOCKED_RETRY_SECONDS:-180}" --attempt-timeout-seconds "$${YEOLJEONG_AUTO_COLLECT_TIMEOUT_SECONDS:-300}"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - aads_network
    depends_on:
      aads-postgres:
        condition: service_healthy
      yeoljeong-finance:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 1G
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  aads-litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: aads-litellm
    restart: always
    ports:
      - "4000:4000"
    env_file:
      - .env.litellm
    environment:
      - DISABLE_SCHEMA_UPDATE=true
      - DISABLE_SPEND_LOGS=true
      - TZ=Asia/Seoul
    volumes:
      - ./litellm-config.yaml:/app/config.yaml:ro
    command: ["--config", "/app/config.yaml", "--port", "4000"]
    networks:
      aads_network:
        aliases:
          - litellm
    mem_limit: 1g
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:4000/health/readiness')\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  aads-searxng:
    image: searxng/searxng:latest
    container_name: aads-searxng
    restart: unless-stopped
    ports:
      - "8888:8080"
    environment:
      - SEARXNG_BASE_URL=http://aads-searxng:8080
      - TZ=Asia/Seoul
    volumes:
      - ./searxng:/etc/searxng:rw
    networks:
      - aads_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  aads-dashboard:
    build:
      context: ../aads-dashboard
      dockerfile: Dockerfile
    container_name: aads-dashboard
    restart: always
    ports:
      # Host-only dashboard port. Public traffic must enter through nginx :443.
      - "127.0.0.1:3100:3100"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://aads.newtalk.kr/api/v1
      - PORT=3100
      - TZ=Asia/Seoul
      - AADS_RELEASE_SHA=${AADS_RELEASE_SHA:-unknown}
    networks:
      - aads_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://$(hostname -i | awk '{print $1}'):3100/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  aads-dashboard-green:
    build:
      context: ../aads-dashboard
      dockerfile: Dockerfile
    container_name: aads-dashboard-green
    restart: unless-stopped
    ports:
      # Host-only dashboard port. Public traffic must enter through nginx :443.
      - "127.0.0.1:3101:3101"
    environment:
      - NODE_ENV=production
      - NEXT_PUBLIC_API_URL=https://aads.newtalk.kr/api/v1
      - PORT=3101
      - TZ=Asia/Seoul
      - AADS_RELEASE_SHA=${AADS_RELEASE_SHA:-unknown}
    networks:
      - aads_network
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://$(hostname -i | awk '{print $1}'):3101/login || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    profiles:
      - green
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  aads_postgres_data:
  aads_redis_data:
  aads_generated_media:

networks:
  aads_network:
    external: true
